<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema Botica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: #f4f6f9;
            transition: background 0.3s, color 0.3s;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        h4, h5, .fw-bold { font-family: 'Inter', sans-serif; }

        /* ═══ Encabezado ═══ */
        .header-banner {
            background: linear-gradient(135deg, #0D2B4E, #1C5FA8);
            border-radius: 18px;
            padding: 22px 26px;
            color: #fff;
            margin-bottom: 22px;
            box-shadow: 0 8px 24px rgba(13,43,78,0.25);
            position: relative;
            overflow: hidden;
        }
        .header-banner::after {
            content: '';
            position: absolute;
            width: 220px; height: 220px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            top: -100px; right: -60px;
        }
        .header-banner h4 { color: #fff !important; font-weight: 800; letter-spacing: -0.3px; position: relative; z-index: 1; }
        .header-banner p { color: rgba(255,255,255,0.75) !important; position: relative; z-index: 1; }
        .header-banner .btn-nueva-venta {
            background: #fff;
            color: #0D2B4E;
            font-weight: 700;
            border: none;
            position: relative; z-index: 1;
        }
        .header-banner .btn-nueva-venta:hover { background: #eef4fa; color: #0D2B4E; }

        /* ═══ Tarjetas de estadísticas ═══ */
        .card-stat {
            border-radius: 16px;
            border: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            transition: transform 0.2s, background 0.3s, color 0.3s, box-shadow 0.2s;
        }
        .card-stat:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,0.08); }
        .card-stat .icono {
            width: 52px; height: 52px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .icono-blue   { background: #e3f0fb; color: #1C5FA8; }
        .icono-cyan   { background: #e5f6f8; color: #0891b2; }
        .icono-red    { background: #fce4ec; color: #C62828; }
        .icono-amber  { background: #fff8e1; color: #F9A825; }

        .card-stat .stat-label {
            font-size: 12.5px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .card-stat h4 { font-weight: 800; letter-spacing: -0.5px; }

        .card-alerta {
            border-radius: 16px; border: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            transition: background 0.3s, color 0.3s;
        }
        .badge-vencido { background: #e53935; font-size: 10.5px; font-weight: 600; padding: 5px 8px; }
        .badge-stock   { background: #f57c00; font-size: 10.5px; font-weight: 600; padding: 5px 8px; }
        .badge-dias    { background: #f9a825; color:#333; font-size: 10.5px; font-weight: 600; padding: 5px 8px; }
        .venta-row { border-left: 3px solid #1C5FA8; padding-left: 12px; margin-bottom: 10px; }

        .acceso-card {
            border-radius: 16px; border: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            transition: all 0.2s, background 0.3s, color 0.3s;
            cursor: pointer;
        }
        .acceso-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(0,0,0,0.1);
        }
        .acceso-icono {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex; align-items: center;
            justify-content: center;
            font-size: 20px;
            margin: 0 auto 8px;
        }
        .acceso-card small { font-size: 13px; font-weight: 600; }

        .section-title {
            font-size: 12.5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9aa5b1;
            font-weight: 700;
        }

        /* ═══ MODO OSCURO ═══ */
        body.modo-oscuro { background: #111418; color: #e0e0e0; }
        body.modo-oscuro .card-stat,
        body.modo-oscuro .card-alerta,
        body.modo-oscuro .acceso-card,
        body.modo-oscuro .card-header { background: #1a1f28 !important; color: #e0e0e0; }
        body.modo-oscuro .text-dark { color: #e0e0e0 !important; }
        body.modo-oscuro .text-muted { color: #9aa5b1 !important; }
        body.modo-oscuro .border-bottom { border-color: #2a3038 !important; }
        body.modo-oscuro .card-header.bg-white { background: #1a1f28 !important; border-bottom: 1px solid #2a3038 !important; }

        /* ═══════════════════ MÓVIL ═══════════════════ */
        @media (max-width: 767.98px) {
            .container-fluid { padding-left: 14px !important; padding-right: 14px !important; }

            .header-banner { padding: 18px; border-radius: 16px; }
            .header-banner .d-flex { flex-direction: column; align-items: stretch !important; gap: 12px; }
            .header-banner h4 { font-size: 19px; }
            .header-banner .btn-nueva-venta { width: 100%; padding: 10px; }

            .card-stat { border-radius: 14px; }
            .card-stat .card-body, .card-stat.p-3 { padding: 12px !important; }
            .card-stat .icono { width: 42px; height: 42px; font-size: 18px; border-radius: 12px; }
            .card-stat .stat-label { font-size: 11px; margin-bottom: 2px !important; }
            .card-stat h4 { font-size: 17px; }

            .section-title { font-size: 11.5px; }

            .acceso-icono { width: 44px; height: 44px; font-size: 18px; }
            .acceso-card small { font-size: 12px; }
        }
    </style>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container-fluid py-4 px-4">

    <!-- Encabezado -->
    <div class="header-banner">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h4 class="fw-bold mb-0"><i class="bi bi-bar-chart-fill me-1"></i> Resumen del Día</h4>
                <p class="small mb-0" id="fecha-hoy"></p>
            </div>
            <a href="/ventas/nueva" class="btn btn-nueva-venta px-4 rounded-pill shadow-sm">
                <i class="bi bi-plus-lg me-1"></i>Nueva Venta
            </a>
        </div>
    </div>

    <!-- Tarjetas resumen -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card card-stat p-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="icono icono-blue"><i class="bi bi-cash-coin"></i></div>
                    <div>
                        <p class="text-muted stat-label mb-1">Ingresos hoy</p>
                        <h4 class="fw-bold mb-0" style="color:#1C5FA8" th:text="'S/ ' + ${totalHoy}"></h4>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card card-stat p-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="icono icono-cyan"><i class="bi bi-cart-check-fill"></i></div>
                    <div>
                        <p class="text-muted stat-label mb-1">Ventas hoy</p>
                        <h4 class="fw-bold mb-0" style="color:#0891b2" th:text="${ventasHoy}"></h4>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card card-stat p-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="icono icono-red"><i class="bi bi-exclamation-triangle-fill"></i></div>
                    <div>
                        <p class="text-muted stat-label mb-1">Stock crítico</p>
                        <h4 class="fw-bold text-danger mb-0" th:text="${stockCritico}"></h4>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card card-stat p-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="icono icono-amber"><i class="bi bi-calendar-event-fill"></i></div>
                    <div>
                        <p class="text-muted stat-label mb-1">Por vencer (30d)</p>
                        <h4 class="fw-bold text-warning mb-0" th:text="${porVencer}"></h4>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Alertas y Ventas -->
    <div class="row g-3 mb-4">

        <!-- Alertas -->
        <div class="col-md-5">
            <div class="card card-alerta h-100">
                <div class="card-header bg-white border-0 pt-3 pb-0 px-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="section-title"><i class="bi bi-bell-fill me-1"></i>Alertas Activas</span>
                        <a href="/alertas" class="text-decoration-none small fw-bold" style="color:#1C5FA8">Ver todas →</a>
                    </div>
                </div>
                <div class="card-body px-4 py-2">
                    <div th:each="p : ${alertasVencidos}" class="d-flex align-items-center gap-2 py-2 border-bottom">
                        <span class="badge badge-vencido">Vencido</span>
                        <span class="small fw-bold flex-fill" th:text="${p.nombre}"></span>
                        <span class="text-muted" style="font-size:11px" th:text="${p.fechaVencimiento}"></span>
                    </div>
                    <div th:each="p : ${alertasStock}" class="d-flex align-items-center gap-2 py-2 border-bottom">
                        <span class="badge badge-stock">Stock</span>
                        <span class="small fw-bold flex-fill" th:text="${p.nombre}"></span>
                        <span class="text-muted" style="font-size:11px" th:text="${p.stock} + ' und.'"></span>
                    </div>
                    <div th:each="p : ${alertasVencimiento}" class="d-flex align-items-center gap-2 py-2 border-bottom">
                        <span class="badge badge-dias">30 días</span>
                        <span class="small fw-bold flex-fill" th:text="${p.nombre}"></span>
                        <span class="text-muted" style="font-size:11px" th:text="${p.fechaVencimiento}"></span>
                    </div>
                    <div class="py-3 text-center small" style="color:#1C5FA8"
                         th:if="${#lists.isEmpty(alertasVencidos)} and ${#lists.isEmpty(alertasStock)} and ${#lists.isEmpty(alertasVencimiento)}">
                        ✅ No hay alertas activas
                    </div>
                </div>
            </div>
        </div>

        <!-- Últimas Ventas -->
        <div class="col-md-7">
            <div class="card card-alerta h-100">
                <div class="card-header bg-white border-0 pt-3 pb-0 px-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="section-title"><i class="bi bi-cart-fill me-1"></i>Últimas Ventas</span>
                        <a href="/ventas" class="text-decoration-none small fw-bold" style="color:#1C5FA8">Ver todas →</a>
                    </div>
                </div>
                <div class="card-body px-4 py-2">
                    <div th:each="v : ${ultimasVentas}" class="venta-row py-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="fw-bold small" th:text="'Venta #' + ${v.id}"></span>
                                <span class="text-muted small ms-2" th:text="${v.cliente}"></span>
                            </div>
                            <div class="text-end">
                                <span class="fw-bold" style="color:#1C5FA8" th:text="'S/ ' + ${v.total}"></span>
                                <div class="text-muted" style="font-size:11px"
                                     th:text="${#temporals.format(v.fecha,'HH:mm')}"></div>
                            </div>
                        </div>
                    </div>
                    <div class="py-3 text-center text-muted small"
                         th:if="${#lists.isEmpty(ultimasVentas)}">
                        No hay ventas registradas hoy
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Accesos Rápidos -->
    <p class="section-title mb-3"><i class="bi bi-lightning-charge-fill me-1"></i>Accesos Rápidos</p>
    <div class="row g-3">
        <div class="col-4 col-md-2">
            <a href="/productos" class="text-decoration-none">
                <div class="card acceso-card p-3 text-center">
                    <div class="acceso-icono bg-primary bg-opacity-10 text-primary"><i class="bi bi-box-seam-fill"></i></div>
                    <small class="fw-bold text-dark">Productos</small>
                </div>
            </a>
        </div>
        <div class="col-4 col-md-2">
            <a href="/ventas/nueva" class="text-decoration-none">
                <div class="card acceso-card p-3 text-center">
                    <div class="acceso-icono bg-info bg-opacity-10 text-info"><i class="bi bi-cart-plus-fill"></i></div>
                    <small class="fw-bold text-dark">Nueva Venta</small>
                </div>
            </a>
        </div>
        <div class="col-4 col-md-2">
            <a href="/proveedores" class="text-decoration-none">
                <div class="card acceso-card p-3 text-center">
                    <div class="acceso-icono bg-warning bg-opacity-10 text-warning"><i class="bi bi-truck"></i></div>
                    <small class="fw-bold text-dark">Proveedores</small>
                </div>
            </a>
        </div>
        <div class="col-4 col-md-2">
            <a href="/usuarios" class="text-decoration-none">
                <div class="card acceso-card p-3 text-center">
                    <div class="acceso-icono bg-secondary bg-opacity-10 text-secondary"><i class="bi bi-people-fill"></i></div>
                    <small class="fw-bold text-dark">Usuarios</small>
                </div>
            </a>
        </div>
        <div class="col-4 col-md-2">
            <a href="/alertas" class="text-decoration-none">
                <div class="card acceso-card p-3 text-center">
                    <div class="acceso-icono bg-danger bg-opacity-10 text-danger"><i class="bi bi-bell-fill"></i></div>
                    <small class="fw-bold text-dark">Alertas</small>
                </div>
            </a>
        </div>
        <div class="col-4 col-md-2">
            <a href="/reportes" class="text-decoration-none">
                <div class="card acceso-card p-3 text-center">
                    <div class="acceso-icono bg-primary bg-opacity-10 text-primary"><i class="bi bi-graph-up-arrow"></i></div>
                    <small class="fw-bold text-dark">Reportes</small>
                </div>
            </a>
        </div>
    </div>

</div>

<script>
    const fecha = new Date();
    const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('fecha-hoy').textContent =
        fecha.toLocaleDateString('es-PE', opciones).toUpperCase();

    if (localStorage.getItem('tema') === 'oscuro') {
        document.body.classList.add('modo-oscuro');
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
