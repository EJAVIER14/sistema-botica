<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página no encontrada - Sistema Botica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .error-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.10);
            padding: 60px 40px;
            text-align: center;
            max-width: 520px;
            width: 100%;
        }

        .error-numero {
            font-size: 96px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #1B5E20, #2E7D32, #66BB6A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .icon-wrapper {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #2E7D32;
            font-size: 42px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .error-title {
            font-size: 22px;
            font-weight: 800;
            color: #212121;
            margin-bottom: 10px;
        }

        .error-subtitle {
            color: #757575;
            font-size: 14.5px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-volver {
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            color: white;
            border: none;
            padding: 13px 32px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(46,125,50,0.3);
        }
        .btn-volver:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(46,125,50,0.4);
            color: white;
        }

        .btn-atras {
            background: #f5f5f5;
            color: #616161;
            border: none;
            padding: 13px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            margin-left: 10px;
        }
        .btn-atras:hover { background: #eeeeee; color: #424242; }

        @media (max-width: 480px) {
            .error-card { padding: 40px 24px; border-radius: 20px; }
            .error-numero { font-size: 72px; }
            .icon-wrapper { width: 80px; height: 80px; font-size: 34px; }
            .botones-wrap { display: flex; flex-direction: column; gap: 10px; }
            .btn-volver, .btn-atras { width: 100%; justify-content: center; margin-left: 0; }
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="icon-wrapper">
        <i class="bi bi-signpost-2-fill"></i>
    </div>
    <div class="error-numero">404</div>
    <h1 class="error-title">Página no encontrada</h1>
    <p class="error-subtitle">
        La página que buscas no existe o fue movida. Verifica la dirección o vuelve al inicio.
    </p>

    <div class="botones-wrap">
        <a href="/" class="btn-volver"><i class="bi bi-house-fill"></i>Volver al inicio</a>
        <a href="javascript:history.back()" class="btn-atras"><i class="bi bi-arrow-left"></i>Regresar</a>
    </div>
</div>

</body>
</html>
