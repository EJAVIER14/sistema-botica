<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; transition: background 0.3s, color 0.3s; }
        .perfil-header {
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            border-radius: 20px 20px 0 0;
            padding: 40px 32px;
            text-align: center;
            color: white;
        }
        .avatar-grande {
            width: 90px; height: 90px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; font-weight: 800;
            margin: 0 auto 16px;
            border: 3px solid rgba(255,255,255,0.4);
        }
        .perfil-card { border-radius: 20px; border: none; box-shadow: 0 8px 32px rgba(0,0,0,0.10); overflow: hidden; }
        .perfil-body { padding: 32px; }
        .info-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid #f0f0f0;
        }
        .info-item:last-child { border-bottom: none; }
        .info-label { color: #9e9e9e; font-size: 13px; font-weight: 600; }
        .info-value { color: #212121; font-size: 14px; font-weight: 700; }
        .rol-badge { font-size: 11px; padding: 5px 14px; border-radius: 20px; font-weight: 700; }
        .form-input {
            width: 100%; padding: 12px 16px;
            border: 2px solid #e0e0e0; border-radius: 12px;
            font-size: 14px; transition: all 0.2s;
            background: #fafafa;
        }
        .form-input:focus {
            outline: none; border-color: #2E7D32;
            background: white; box-shadow: 0 0 0 4px rgba(46,125,50,0.08);
        }
        .field-label { font-size: 13px; font-weight: 700; color: #424242; margin-bottom: 8px; display: block; }
        .btn-guardar {
            padding: 12px 28px; border-radius: 12px;
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            color: white; border: none; font-weight: 700; font-size: 14px;
            box-shadow: 0 4px 12px rgba(46,125,50,0.3); transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-guardar:hover { transform: translateY(-2px); color: white; }
        .pass-wrapper { position: relative; }
        .show-pass {
            position: absolute; right: 12px; top: 50%;
            transform: translateY(-50%); background: none; border: none;
            cursor: pointer; font-size: 16px; color: #9e9e9e;
        }
        .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #9e9e9e; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }

        /* ═══ MODO OSCURO ═══ */
        body.modo-oscuro { background: #121212; color: #e0e0e0; }
        body.modo-oscuro .perfil-card { background-color: #1e1e1e !important; }
        body.modo-oscuro .info-item { border-color: #2a2a2a !important; }
        body.modo-oscuro .info-value { color: #f0f0f0 !important; }
        body.modo-oscuro .info-label { color: #9e9e9e !important; }
        body.modo-oscuro .field-label { color: #c0c0c0 !important; }
        body.modo-oscuro .form-input { background-color: #2a2a2a !important; color: #e0e0e0 !important; border-color: #404040 !important; }
        body.modo-oscuro hr { border-color: #2a2a2a !important; }

        @media (max-width: 767.98px) {
            .perfil-header { padding: 28px 20px; border-radius: 16px 16px 0 0; }
            .avatar-grande { width: 72px; height: 72px; font-size: 28px; }
            .perfil-body { padding: 20px; }
            .btn-guardar { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <!-- Alertas -->
            <div th:if="${exito}" class="alert alert-success alert-dismissible fade show rounded-3 mb-3" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i><span th:text="${exito}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-3" role="alert">
                <i class="bi bi-x-circle-fill me-1"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="perfil-card">

                <!-- Header con avatar -->
                <div class="perfil-header">
                    <div class="avatar-grande"
                         th:text="${usuario.nombre != null and usuario.nombre.length() > 0 ? usuario.nombre.substring(0,1).toUpperCase() : '?'}">
                    </div>
                    <h4 class="fw-bold mb-1" th:text="${usuario.nombre}"></h4>
                    <p class="mb-0" style="opacity:0.8" th:text="'@' + ${usuario.username}"></p>
                </div>

                <div class="perfil-body">

                    <!-- Información de la cuenta -->
                    <p class="section-title"><i class="bi bi-person-fill"></i>Información de la cuenta</p>
                    <div class="info-item">
                        <span class="info-label">Nombre completo</span>
                        <span class="info-value" th:text="${usuario.nombre}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Nombre de usuario</span>
                        <span class="info-value" th:text="${usuario.username}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Rol asignado</span>
                        <span class="rol-badge"
                              th:text="${usuario.rol}"
                              th:style="${usuario.rol == 'ADMIN'} ? 'background:#fce4ec;color:#c62828' :
                                        (${usuario.rol == 'CAJERO'} ? 'background:#e3f2fd;color:#1565C0' :
                                        'background:#fff3e0;color:#e65100')">
                        </span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Estado de cuenta</span>
                        <span th:if="${usuario.activo}" class="badge bg-success bg-opacity-10 text-success">● Activo</span>
                        <span th:unless="${usuario.activo}" class="badge bg-danger bg-opacity-10 text-danger">● Inactivo</span>
                    </div>

                    <hr style="margin: 28px 0; border-top: 1px solid #f0f0f0;"/>

                    <!-- Cambiar contraseña -->
                    <p class="section-title"><i class="bi bi-key-fill"></i>Cambiar mi contraseña</p>

                    <form th:action="@{/perfil/cambiar-password}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label class="field-label">Contraseña actual</label>
                            <div class="pass-wrapper">
                                <input type="password" name="passwordActual" id="p1"
                                       class="form-input" style="padding-right:44px" required/>
                                <button type="button" class="show-pass" onclick="toggle('p1', this)"><i class="bi bi-eye-fill"></i></button>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="field-label">Nueva contraseña</label>
                                <div class="pass-wrapper">
                                    <input type="password" name="passwordNueva" id="p2"
                                           class="form-input" style="padding-right:44px"
                                           placeholder="Mínimo 6 caracteres" required/>
                                    <button type="button" class="show-pass" onclick="toggle('p2', this)"><i class="bi bi-eye-fill"></i></button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="field-label">Confirmar nueva</label>
                                <div class="pass-wrapper">
                                    <input type="password" name="passwordConfirmar" id="p3"
                                           class="form-input" style="padding-right:44px" required/>
                                    <button type="button" class="show-pass" onclick="toggle('p3', this)"><i class="bi bi-eye-fill"></i></button>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn-guardar"><i class="bi bi-key-fill"></i>Actualizar contraseña</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggle(id, btn) {
        const input = document.getElementById(id);
        const icono = btn.querySelector('i');
        input.type = input.type === 'password' ? 'text' : 'password';
        if (input.type === 'password') {
            icono.classList.remove('bi-eye-slash-fill');
            icono.classList.add('bi-eye-fill');
        } else {
            icono.classList.remove('bi-eye-fill');
            icono.classList.add('bi-eye-slash-fill');
        }
    }
    if (localStorage.getItem('tema') === 'oscuro') {
        document.body.classList.add('modo-oscuro');
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
