<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .card-main { border-radius: 16px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .tabla-header { background: linear-gradient(135deg, #1B5E20, #2E7D32); color: white; }
        .tabla-header th { font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; padding: 14px 16px; border: none; }
        .tabla-row td { padding: 12px 16px; vertical-align: middle; border-bottom: 1px solid #f0f0f0; }
        .tabla-row:hover { background: #f8fff8; }
        .badge-cat { font-size: 11px; padding: 5px 10px; border-radius: 20px; font-weight: 500; }
        .badge-stock { font-size: 12px; padding: 5px 12px; border-radius: 20px; font-weight: 600; }
        .btn-accion { width: 32px; height: 32px; padding: 0; border-radius: 8px; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
        .precio-text { color: #2E7D32; font-weight: 700; font-size: 14px; }
        .id-text { color: #9e9e9e; font-size: 12px; font-weight: 600; }
        .nombre-text { font-weight: 600; color: #212121; font-size: 14px; }
        .venc-text { font-size: 13px; color: #616161; }
        .search-box { border-radius: 12px; border: 2px solid #e0e0e0; padding: 10px 16px; }
        .search-box:focus { border-color: #2E7D32; box-shadow: 0 0 0 3px rgba(46,125,50,0.1); outline: none; }
        .stats-bar { background: white; border-radius: 12px; padding: 12px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .empty-state { padding: 60px 20px; text-align: center; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container-fluid py-4 px-4">

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-0" style="color:#1B5E20">📦 Gestión de Productos</h4>
            <p class="text-muted small mb-0">Administra el inventario de medicamentos</p>
        </div>
        <a href="/productos/nuevo" class="btn btn-success px-4 rounded-pill shadow-sm">
            + Nuevo Producto
        </a>
    </div>

    <!-- Barra de búsqueda y estadísticas -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <input type="text" id="buscador" class="form-control search-box"
                   placeholder="🔍 Buscar producto por nombre o categoría..."
                   oninput="filtrarTabla(this.value)"/>
        </div>
        <div class="col-md-6">
            <div class="stats-bar d-flex gap-4 align-items-center">
                <div class="text-center">
                    <div class="fw-bold text-success" id="total-productos">0</div>
                    <div style="font-size:11px; color:#9e9e9e">Total</div>
                </div>
                <div class="vr"></div>
                <div class="text-center">
                    <div class="fw-bold text-danger" id="stock-bajo">0</div>
                    <div style="font-size:11px; color:#9e9e9e">Stock bajo</div>
                </div>
                <div class="vr"></div>
                <div class="text-center">
                    <div class="fw-bold text-warning" id="por-vencer">0</div>
                    <div style="font-size:11px; color:#9e9e9e">Por vencer</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card card-main">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0" id="tabla-productos">
                    <thead class="tabla-header">
                    <tr>
                        <th>#</th>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Vencimiento</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="tabla-row" th:each="producto : ${productos}">
                        <td><span class="id-text" th:text="${producto.id}"></span></td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div style="width:36px;height:36px;background:#e8f5e9;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;">💊</div>
                                <div>
                                    <div class="nombre-text" th:text="${producto.nombre}"></div>
                                    <div style="font-size:11px;color:#9e9e9e" th:text="${producto.descripcion != null ? producto.descripcion : ''}"></div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="badge badge-cat"
                                  th:classappend="${producto.categoria == 'Antibiótico'} ? 'bg-danger bg-opacity-10 text-danger' :
                                                 (${producto.categoria == 'Analgésico'} ? 'bg-warning bg-opacity-10 text-warning' :
                                                 (${producto.categoria == 'Suplemento'} ? 'bg-info bg-opacity-10 text-info' :
                                                 'bg-secondary bg-opacity-10 text-secondary'))"
                                  th:text="${producto.categoria}">
                            </span>
                        </td>
                        <td><span class="precio-text" th:text="'S/ ' + ${producto.precio}"></span></td>
                        <td>
                            <span class="badge badge-stock"
                                  th:text="${producto.stock}"
                                  th:class="${producto.stock == 0} ? 'badge badge-stock bg-danger' :
                                            (${producto.stock < 10} ? 'badge badge-stock bg-warning text-dark' : 'badge badge-stock bg-success')">
                            </span>
                        </td>
                        <td>
                            <span class="venc-text" th:text="${producto.fechaVencimiento}"></span>
                        </td>
                        <td>
                            <div class="d-flex gap-1">
                                <a th:href="@{/productos/entrada/{id}(id=${producto.id})}"
                                   class="btn btn-accion btn-success"
                                   title="Registrar entrada">⬆️</a>
                                <a th:href="@{/productos/editar/{id}(id=${producto.id})}"
                                   class="btn btn-accion btn-primary"
                                   title="Editar">✏️</a>
                                <a th:href="@{/productos/eliminar/{id}(id=${producto.id})}"
                                   class="btn btn-accion btn-danger"
                                   title="Eliminar"
                                   onclick="return confirm('¿Seguro que deseas eliminar este producto?')">🗑️</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Estado vacío -->
            <div class="empty-state" id="empty-state" style="display:none;">
                <div style="font-size:48px;">🔍</div>
                <h5 class="text-muted mt-2">No se encontraron productos</h5>
                <p class="text-muted small">Intenta con otro término de búsqueda</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Contadores estadísticas
    window.onload = function() {
        const filas = document.querySelectorAll('.tabla-row');
        let stockBajo = 0, porVencer = 0;
        const hoy = new Date();
        const limite = new Date();
        limite.setDate(limite.getDate() + 30);

        filas.forEach(fila => {
            const stockEl = fila.querySelector('.badge-stock');
            const vencEl = fila.querySelector('.venc-text');
            if (stockEl) {
                const s = parseInt(stockEl.textContent);
                if (s < 10) stockBajo++;
            }
            if (vencEl && vencEl.textContent.trim()) {
                const fecha = new Date(vencEl.textContent.trim());
                if (fecha <= limite) porVencer++;
            }
        });

        document.getElementById('total-productos').textContent = filas.length;
        document.getElementById('stock-bajo').textContent = stockBajo;
        document.getElementById('por-vencer').textContent = porVencer;
    };

    function filtrarTabla(texto) {
        const filas = document.querySelectorAll('.tabla-row');
        const termino = texto.toLowerCase();
        let visibles = 0;

        filas.forEach(fila => {
            const nombre = fila.querySelector('.nombre-text')?.textContent.toLowerCase() || '';
            const cat = fila.querySelector('.badge-cat')?.textContent.toLowerCase() || '';
            if (nombre.includes(termino) || cat.includes(termino)) {
                fila.style.display = '';
                visibles++;
            } else {
                fila.style.display = 'none';
            }
        });

        document.getElementById('empty-state').style.display = visibles === 0 ? 'block' : 'none';
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
