<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; transition: background 0.3s, color 0.3s; }
        .card-main { border-radius: 16px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); transition: background 0.3s; }
        .tabla-header { background: linear-gradient(135deg, #1B5E20, #2E7D32); color: white; }
        .tabla-header th { font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; padding: 14px 16px; border: none; }
        .tabla-row td { padding: 12px 16px; vertical-align: middle; border-bottom: 1px solid #f0f0f0; }
        .tabla-row:hover { background: #f8fff8; }
        .badge-cat { font-size: 11px; padding: 5px 10px; border-radius: 20px; font-weight: 500; }
        .badge-stock { font-size: 12px; padding: 5px 12px; border-radius: 20px; font-weight: 600; }
        .btn-accion { width: 32px; height: 32px; padding: 0; border-radius: 8px; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
        .precio-text { color: #2E7D32; font-weight: 700; font-size: 14px; }
        .id-text { color: #9e9e9e; font-size: 12px; font-weight: 600; }
        .nombre-text { font-weight: 600; color: #212121; font-size: 14px; }
        .venc-text { font-size: 13px; color: #616161; }
        .search-box { border-radius: 12px; border: 2px solid #e0e0e0; padding: 10px 16px; }
        .search-box:focus { border-color: #2E7D32; box-shadow: 0 0 0 3px rgba(46,125,50,0.1); outline: none; }
        .stats-bar { background: white; border-radius: 12px; padding: 12px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: background 0.3s; }
        .empty-state { padding: 60px 20px; text-align: center; }

        .pagination-wrapper {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; border-top: 1px solid #f0f0f0;
        }
        .pagination-info { font-size: 13px; color: #9e9e9e; }
        .pagination-btns { display: flex; gap: 6px; }
        .page-btn {
            min-width: 36px; height: 36px; padding: 0 10px;
            border-radius: 8px; border: 1px solid #e0e0e0;
            background: white; color: #616161; font-size: 13px;
            font-weight: 600; display: flex; align-items: center; justify-content: center;
            text-decoration: none; transition: all 0.2s;
        }
        .page-btn:hover { background: #f1f8e9; border-color: #2E7D32; color: #1B5E20; }
        .page-btn.active { background: #2E7D32; border-color: #2E7D32; color: white; }
        .page-btn.disabled { opacity: 0.4; pointer-events: none; }

        /* ═══ MODO OSCURO ═══ */
        body.modo-oscuro { background: #121212; color: #e0e0e0; }
        body.modo-oscuro .card,
        body.modo-oscuro .card-main,
        body.modo-oscuro .stats-bar,
        body.modo-oscuro .page-btn { background-color: #1e1e1e !important; color: #e0e0e0 !important; border-color: #333 !important; }
        body.modo-oscuro table { background-color: #1e1e1e !important; color: #e0e0e0 !important; }
        body.modo-oscuro .table > :not(caption) > * > * { background-color: #1e1e1e !important; color: #e0e0e0 !important; box-shadow: none; }
        body.modo-oscuro .tabla-row td { border-color: #2a2a2a !important; color: #d0d0d0 !important; }
        body.modo-oscuro .tabla-row:hover { background-color: #252525 !important; }
        body.modo-oscuro .nombre-text { color: #f0f0f0 !important; }
        body.modo-oscuro .venc-text { color: #b0b0b0 !important; }
        body.modo-oscuro .id-text { color: #888 !important; }
        body.modo-oscuro .text-muted { color: #9e9e9e !important; }
        body.modo-oscuro div[style*="color:#9e9e9e"],
        body.modo-oscuro span[style*="color:#9e9e9e"] { color: #999999 !important; }
        body.modo-oscuro .search-box { background-color: #1e1e1e !important; color: #e0e0e0 !important; border-color: #333 !important; }
        body.modo-oscuro .search-box::placeholder { color: #777 !important; }
        body.modo-oscuro .pagination-wrapper { border-color: #333 !important; }
        body.modo-oscuro h4[style*="color:#1B5E20"] { color: #66BB6A !important; }
        body.modo-oscuro .page-btn.active { background-color: #2E7D32 !important; color: white !important; }
        body.modo-oscuro [style*="background:#e8f5e9"] { background: #1b3320 !important; }
        body.modo-oscuro .badge-cat.bg-secondary { background-color: #2a2a2a !important; color: #b0b0b0 !important; }
        body.modo-oscuro .badge.bg-warning.text-dark { color: #1a1a1a !important; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container-fluid py-4 px-4">

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-0" style="color:#1B5E20">📦 Gestión de Productos</h4>
            <p class="text-muted small mb-0">Administra el inventario de medicamentos</p>
        </div>
        <a href="/productos/nuevo" class="btn btn-success px-4 rounded-pill shadow-sm">
            + Nuevo Producto
        </a>
    </div>

    <!-- Barra de búsqueda -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <form action="/productos" method="get">
                <input type="text" name="buscar" class="form-control search-box"
                       placeholder="🔍 Buscar producto por nombre..."
                       th:value="${buscar}"/>
            </form>
        </div>
        <div class="col-md-6">
            <div class="stats-bar d-flex gap-4 align-items-center justify-content-center">
                <div class="text-center">
                    <div class="fw-bold text-success" th:text="${totalElementos}">0</div>
                    <div style="font-size:11px; color:#9e9e9e">Total productos</div>
                </div>
                <div class="vr"></div>
                <div class="text-center">
                    <div class="fw-bold text-primary" th:text="${paginaActual + 1} + ' / ' + ${totalPaginas}">1/1</div>
                    <div style="font-size:11px; color:#9e9e9e">Página</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card card-main">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead class="tabla-header">
                    <tr>
                        <th>#</th>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Vencimiento</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="tabla-row" th:each="producto : ${productos}">
                        <td><span class="id-text" th:text="${producto.id}"></span></td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div style="width:36px;height:36px;background:#e8f5e9;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;">💊</div>
                                <div>
                                    <div class="nombre-text" th:text="${producto.nombre}"></div>
                                    <div style="font-size:11px;color:#9e9e9e" th:text="${producto.descripcion != null ? producto.descripcion : ''}"></div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="badge badge-cat"
                                  th:classappend="${producto.categoria == 'Antibiótico'} ? 'bg-danger bg-opacity-10 text-danger' :
                                                 (${producto.categoria == 'Analgésico'} ? 'bg-warning bg-opacity-10 text-warning' :
                                                 (${producto.categoria == 'Suplemento'} ? 'bg-info bg-opacity-10 text-info' :
                                                 'bg-secondary bg-opacity-10 text-secondary'))"
                                  th:text="${producto.categoria}">
                            </span>
                        </td>
                        <td><span class="precio-text" th:text="'S/ ' + ${producto.precio}"></span></td>
                        <td>
                            <span class="badge badge-stock"
                                  th:text="${producto.stock}"
                                  th:class="${producto.stock == 0} ? 'badge badge-stock bg-danger' :
                                            (${producto.stock < 10} ? 'badge badge-stock bg-warning text-dark' : 'badge badge-stock bg-success')">
                            </span>
                        </td>
                        <td>
                            <span class="venc-text" th:text="${producto.fechaVencimiento}"></span>
                        </td>
                        <td>
                            <div class="d-flex gap-1">
                                <a th:href="@{/productos/entrada/{id}(id=${producto.id})}"
                                   class="btn btn-accion btn-success"
                                   title="Registrar entrada">⬆️</a>
                                <a th:href="@{/productos/editar/{id}(id=${producto.id})}"
                                   class="btn btn-accion btn-primary"
                                   title="Editar">✏️</a>
                                <a th:href="@{/productos/eliminar/{id}(id=${producto.id})}"
                                   class="btn btn-accion btn-danger"
                                   title="Eliminar"
                                   onclick="return confirm('¿Seguro que deseas eliminar este producto?')">🗑️</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Estado vacío -->
            <div class="empty-state" th:if="${#lists.isEmpty(productos)}">
                <div style="font-size:48px;">🔍</div>
                <h5 class="text-muted mt-2">No se encontraron productos</h5>
                <p class="text-muted small">Intenta con otro término de búsqueda</p>
            </div>

            <!-- Paginación -->
            <div class="pagination-wrapper" th:if="${totalPaginas > 1}">
                <span class="pagination-info">
                    Página <strong th:text="${paginaActual + 1}"></strong> de <strong th:text="${totalPaginas}"></strong>
                    — <span th:text="${totalElementos}"></span> productos en total
                </span>
                <div class="pagination-btns">
                    <a th:if="${paginaActual > 0}"
                       th:href="@{/productos(page=${paginaActual - 1}, buscar=${buscar})}"
                       class="page-btn">←</a>
                    <span th:if="${paginaActual == 0}" class="page-btn disabled">←</span>

                    <a th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}"
                       th:if="${i >= paginaActual - 2 and i <= paginaActual + 2}"
                       th:href="@{/productos(page=${i}, buscar=${buscar})}"
                       th:class="${i == paginaActual} ? 'page-btn active' : 'page-btn'"
                       th:text="${i + 1}">
                    </a>

                    <a th:if="${paginaActual < totalPaginas - 1}"
                       th:href="@{/productos(page=${paginaActual + 1}, buscar=${buscar})}"
                       class="page-btn">→</a>
                    <span th:if="${paginaActual == totalPaginas - 1}" class="page-btn disabled">→</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    if (localStorage.getItem('tema') === 'oscuro') {
        document.body.classList.add('modo-oscuro');
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
