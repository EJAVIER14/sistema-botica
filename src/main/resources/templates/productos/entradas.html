<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrada de Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">⬆️ Entrada de Stock</h5>
                </div>
                <div class="card-body p-4">
                    <form action="/productos/entrada/guardar" method="post">

                        <input type="hidden" name="productoId"
                               th:value="${producto.id}"/>

                        <!-- Producto -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Producto</label>
                            <input type="text" class="form-control"
                                   th:value="${producto.nombre}"
                                   readonly/>
                        </div>

                        <!-- Stock actual -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Stock actual</label>
                            <input type="number" class="form-control"
                                   th:value="${producto.stock}"
                                   readonly/>
                        </div>

                        <!-- Cantidad a ingresar -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Cantidad a ingresar
                            </label>
                            <input type="number" name="cantidad"
                                   class="form-control"
                                   min="1" placeholder="Ej: 50"
                                   required/>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                ✅ Registrar Entrada
                            </button>
                            <a href="/productos" class="btn btn-secondary btn-lg">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
