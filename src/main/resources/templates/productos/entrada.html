<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrada de Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; transition: background 0.3s, color 0.3s; }
        .entrada-card { border-radius: 18px; border: none; box-shadow: 0 8px 28px rgba(0,0,0,0.08); overflow: hidden; }
        .entrada-header {
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            padding: 22px 28px; color: white;
        }
        .entrada-header h5 { font-weight: 800; margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
        .entrada-body { padding: 28px; }
        .field-label { font-size: 13px; font-weight: 700; color: #424242; margin-bottom: 8px; display: block; }
        .form-control {
            border-radius: 12px; border: 2px solid #e0e0e0; padding: 11px 16px; font-size: 14px;
        }
        .form-control:focus { border-color: #2E7D32; box-shadow: 0 0 0 4px rgba(46,125,50,0.08); }
        .form-control[readonly] { background: #f5f5f5; color: #616161; font-weight: 600; }
        .btn-registrar {
            padding: 13px; border-radius: 12px;
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            color: white; border: none; font-weight: 700; font-size: 14px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            box-shadow: 0 4px 14px rgba(46,125,50,0.3);
        }
        .btn-registrar:hover { color: white; transform: translateY(-2px); }
        .btn-cancelar-entrada {
            padding: 13px; border-radius: 12px;
            background: #f5f5f5; color: #616161; border: none; font-weight: 600; font-size: 14px;
            text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-cancelar-entrada:hover { background: #eeeeee; color: #424242; }

        body.modo-oscuro { background: #121212; color: #e0e0e0; }
        body.modo-oscuro .entrada-card { background-color: #1e1e1e !important; color: #e0e0e0 !important; }
        body.modo-oscuro .form-control { background-color: #2a2a2a !important; color: #e0e0e0 !important; border-color: #404040 !important; }
        body.modo-oscuro .field-label { color: #c0c0c0 !important; }
        body.modo-oscuro .form-control[readonly] { background-color: #242424 !important; color: #999 !important; }
        body.modo-oscuro .btn-cancelar-entrada { background-color: #2a2a2a !important; color: #b0b0b0 !important; }

        @media (max-width: 767.98px) {
            .entrada-header { padding: 18px 20px; }
            .entrada-body { padding: 20px; }
            .d-flex.gap-2 { flex-direction: column; }
        }
    </style>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="entrada-card">
                <div class="entrada-header">
                    <h5><i class="bi bi-box-arrow-in-up"></i>Entrada de Stock</h5>
                </div>
                <div class="entrada-body">
                    <form action="/productos/entrada/guardar" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <input type="hidden" name="productoId"
                               th:value="${producto.id}"/>

                        <!-- Producto -->
                        <div class="mb-3">
                            <label class="field-label">Producto</label>
                            <input type="text" class="form-control"
                                   th:value="${producto.nombre}"
                                   readonly/>
                        </div>

                        <!-- Stock actual -->
                        <div class="mb-3">
                            <label class="field-label">Stock actual</label>
                            <input type="number" class="form-control"
                                   th:value="${producto.stock}"
                                   readonly/>
                        </div>

                        <!-- Cantidad a ingresar -->
                        <div class="mb-4">
                            <label class="field-label">Cantidad a ingresar</label>
                            <input type="number" name="cantidad"
                                   class="form-control"
                                   min="1" placeholder="Ej: 50"
                                   required/>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn-registrar flex-fill">
                                <i class="bi bi-check-lg"></i>Registrar Entrada
                            </button>
                            <a href="/productos" class="btn-cancelar-entrada flex-fill">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    if (localStorage.getItem('tema') === 'oscuro') { document.body.classList.add('modo-oscuro'); }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
