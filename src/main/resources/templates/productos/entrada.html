<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrada de Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; transition: background 0.3s, color 0.3s; }
        body.modo-oscuro { background: #121212; color: #e0e0e0; }
        body.modo-oscuro .card { background-color: #1e1e1e !important; color: #e0e0e0 !important; }
        body.modo-oscuro .form-control { background-color: #2a2a2a !important; color: #e0e0e0 !important; border-color: #404040 !important; }
        body.modo-oscuro .form-label { color: #c0c0c0 !important; }
        body.modo-oscuro .form-control[readonly] { background-color: #242424 !important; color: #999 !important; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">⬆️ Entrada de Stock</h5>
                </div>
                <div class="card-body p-4">
                    <form action="/productos/entrada/guardar" method="post">

                        <input type="hidden" name="productoId"
                               th:value="${producto.id}"/>

                        <!-- Producto -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Producto</label>
                            <input type="text" class="form-control"
                                   th:value="${producto.nombre}"
                                   readonly/>
                        </div>

                        <!-- Stock actual -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Stock actual</label>
                            <input type="number" class="form-control"
                                   th:value="${producto.stock}"
                                   readonly/>
                        </div>

                        <!-- Cantidad a ingresar -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Cantidad a ingresar
                            </label>
                            <input type="number" name="cantidad"
                                   class="form-control"
                                   min="1" placeholder="Ej: 50"
                                   required/>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                ✅ Registrar Entrada
                            </button>
                            <a href="/productos" class="btn btn-secondary btn-lg">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    if (localStorage.getItem('tema') === 'oscuro') { document.body.classList.add('modo-oscuro'); }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
