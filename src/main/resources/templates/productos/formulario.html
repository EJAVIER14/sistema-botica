<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; transition: background 0.3s, color 0.3s; }
        .form-card { border-radius: 20px; border: none; box-shadow: 0 8px 32px rgba(0,0,0,0.10); overflow: hidden; }
        .form-header { background: linear-gradient(135deg, #1B5E20, #2E7D32); padding: 28px 32px; }
        .form-header h4 { color: white; font-weight: 800; margin: 0; font-size: 20px; }
        .form-header p { color: rgba(255,255,255,0.7); margin: 4px 0 0; font-size: 13px; }
        .form-body { padding: 32px; }
        .field-label { font-size: 13px; font-weight: 700; color: #424242; margin-bottom: 8px; display: block; }
        .field-label span { color: #e53935; }
        .form-input {
            width: 100%; padding: 12px 16px;
            border: 2px solid #e0e0e0; border-radius: 12px;
            font-size: 14px; transition: all 0.2s;
            background: #fafafa; color: #212121;
        }
        .form-input:focus {
            outline: none; border-color: #2E7D32;
            background: white; box-shadow: 0 0 0 4px rgba(46,125,50,0.08);
        }
        .field-hint { font-size: 11px; color: #9e9e9e; margin-top: 5px; }
        .section-divider { border: none; border-top: 1px solid #f0f0f0; margin: 20px 0; }
        .btn-guardar {
            padding: 13px 32px; border-radius: 12px;
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            color: white; border: none; font-weight: 700;
            font-size: 14px; transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(46,125,50,0.3);
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-guardar:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(46,125,50,0.4); color: white; }
        .btn-cancelar {
            padding: 13px 24px; border-radius: 12px;
            background: #f5f5f5; color: #616161;
            border: none; font-weight: 600; font-size: 14px;
            transition: all 0.2s; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-cancelar:hover { background: #eeeeee; color: #424242; }
        .categoria-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .cat-option { display: none; }
        .cat-label {
            display: flex; flex-direction: column; align-items: center;
            padding: 10px 8px; border: 2px solid #e0e0e0;
            border-radius: 10px; cursor: pointer; transition: all 0.2s;
            font-size: 12px; font-weight: 600; color: #616161;
            text-align: center; background: #fafafa;
        }
        .cat-label:hover { border-color: #2E7D32; background: #f1f8e9; }
        .cat-option:checked + .cat-label {
            border-color: #2E7D32; background: #e8f5e9; color: #1B5E20;
        }
        .cat-icono { font-size: 18px; margin-bottom: 4px; }
        .presentacion-box {
            background: #f1f8e9; border: 1px solid #c8e6c9;
            border-radius: 12px; padding: 16px;
        }
        .error-box {
            background: #fce4ec; border: 1px solid #f48fb1;
            color: #c62828; padding: 12px 16px; border-radius: 10px;
            margin-bottom: 20px; font-size: 13px;
            display: flex; align-items: center; gap: 8px;
        }

        /* ═══ MODO OSCURO ═══ */
        body.modo-oscuro { background: #121212; color: #e0e0e0; }
        body.modo-oscuro .form-card { background-color: #1e1e1e !important; }
        body.modo-oscuro .field-label { color: #c0c0c0 !important; }
        body.modo-oscuro .form-input { background-color: #2a2a2a !important; color: #e0e0e0 !important; border-color: #404040 !important; }
        body.modo-oscuro .field-hint { color: #888 !important; }
        body.modo-oscuro .section-divider { border-color: #2a2a2a !important; }
        body.modo-oscuro .cat-label { background-color: #2a2a2a !important; border-color: #404040 !important; color: #b0b0b0 !important; }
        body.modo-oscuro .cat-option:checked + .cat-label { background-color: #1b3320 !important; border-color: #2E7D32 !important; color: #81C784 !important; }
        body.modo-oscuro .btn-cancelar { background-color: #2a2a2a !important; color: #b0b0b0 !important; }
        body.modo-oscuro .btn-cancelar:hover { background-color: #353535 !important; }
        body.modo-oscuro .presentacion-box { background-color: #1b3320 !important; border-color: #2E7D32 !important; }

        /* ═══ RESPONSIVE MÓVIL ═══ */
        @media (max-width: 767.98px) {
            .form-header { padding: 22px 20px; }
            .form-header h4 { font-size: 18px; }
            .form-body { padding: 20px; }
            .categoria-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .d-flex.gap-3.mt-4 { flex-direction: column; }
            .btn-guardar, .btn-cancelar { width: 100%; }
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="form-card">

                <!-- Header -->
                <div class="form-header">
                    <h4>
                        <i th:class="${producto.id} ? 'bi bi-pencil-fill me-1' : 'bi bi-box-seam-fill me-1'"></i>
                        <span th:text="${producto.id} ? 'Editar Producto' : 'Nuevo Producto'"></span>
                    </h4>
                    <p th:text="${producto.id} ? 'Modifica los datos del producto' : 'Completa los datos para registrar un nuevo producto'"></p>
                </div>

                <div class="form-body">

                    <div class="error-box" th:if="${error}">
                        <i class="bi bi-exclamation-circle-fill"></i><span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" th:field="*{id}"/>

                        <!-- Nombre -->
                        <div class="mb-4">
                            <label class="field-label">Nombre del producto <span>*</span></label>
                            <input type="text" class="form-input" th:field="*{nombre}"
                                   placeholder="Ej: Paracetamol 500mg" required/>
                        </div>

                        <!-- Descripción -->
                        <div class="mb-4">
                            <label class="field-label">Descripción</label>
                            <input type="text" class="form-input" th:field="*{descripcion}"
                                   placeholder="Ej: Analgésico y antipirético"/>
                            <div class="field-hint">Uso o indicación del medicamento</div>
                        </div>

                        <!-- Categoría -->
                        <div class="mb-4">
                            <label class="field-label">Categoría <span>*</span></label>
                            <div class="categoria-grid">
                                <div>
                                    <input type="radio" name="categoria" id="cat1" value="Analgésico" class="cat-option"
                                           th:checked="${producto.categoria == 'Analgésico'}"/>
                                    <label for="cat1" class="cat-label"><span class="cat-icono"><i class="bi bi-capsule"></i></span>Analgésico</label>
                                </div>
                                <div>
                                    <input type="radio" name="categoria" id="cat2" value="Antibiótico" class="cat-option"
                                           th:checked="${producto.categoria == 'Antibiótico'}"/>
                                    <label for="cat2" class="cat-label"><span class="cat-icono"><i class="bi bi-virus"></i></span>Antibiótico</label>
                                </div>
                                <div>
                                    <input type="radio" name="categoria" id="cat3" value="Vitamina" class="cat-option"
                                           th:checked="${producto.categoria == 'Vitamina'}"/>
                                    <label for="cat3" class="cat-label"><span class="cat-icono"><i class="bi bi-sun-fill"></i></span>Vitamina</label>
                                </div>
                                <div>
                                    <input type="radio" name="categoria" id="cat4" value="Antiinflamatorio" class="cat-option"
                                           th:checked="${producto.categoria == 'Antiinflamatorio'}"/>
                                    <label for="cat4" class="cat-label"><span class="cat-icono"><i class="bi bi-fire"></i></span>Antiinflamatorio</label>
                                </div>
                                <div>
                                    <input type="radio" name="categoria" id="cat5" value="Suplemento" class="cat-option"
                                           th:checked="${producto.categoria == 'Suplemento'}"/>
                                    <label for="cat5" class="cat-label"><span class="cat-icono"><i class="bi bi-lightning-charge-fill"></i></span>Suplemento</label>
                                </div>
                                <div>
                                    <input type="radio" name="categoria" id="cat6" value="Otro" class="cat-option"
                                           th:checked="${producto.categoria == 'Otro'}"/>
                                    <label for="cat6" class="cat-label"><span class="cat-icono"><i class="bi bi-box-seam"></i></span>Otro</label>
                                </div>
                            </div>
                        </div>

                        <hr class="section-divider"/>

                        <!-- Precio y Stock -->
                        <div class="row g-3 mb-4">
                            <div class="col-6">
                                <label class="field-label">Precio por unidad (S/) <span>*</span></label>
                                <div style="position:relative">
                                    <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9e9e9e;font-weight:700">S/</span>
                                    <input type="number" class="form-input" th:field="*{precio}"
                                           style="padding-left:32px" step="0.01" placeholder="0.00" required/>
                                </div>
                                <div class="field-hint">Precio de 1 unidad/pastilla suelta</div>
                            </div>
                            <div class="col-6">
                                <label class="field-label">Stock inicial <span>*</span></label>
                                <input type="number" class="form-input" th:field="*{stock}"
                                       placeholder="0" min="0" required/>
                                <div class="field-hint">Unidades sueltas disponibles</div>
                            </div>
                        </div>

                        <hr class="section-divider"/>

                        <!-- Presentaciones de venta -->
                        <div class="mb-4">
                            <label class="field-label"><i class="bi bi-box-seam me-1"></i>Presentaciones de venta</label>
                            <div class="presentacion-box">
                                <div class="row g-3">
                                    <div class="col-6">
                                        <label class="field-label" style="font-size:12px">Unidades por blíster</label>
                                        <input type="number" class="form-input" th:field="*{unidadesPorBlister}"
                                               placeholder="Ej: 10" min="1"/>
                                    </div>
                                    <div class="col-6">
                                        <label class="field-label" style="font-size:12px">Unidades por caja</label>
                                        <input type="number" class="form-input" th:field="*{unidadesPorCaja}"
                                               placeholder="Ej: 100" min="1"/>
                                    </div>
                                </div>
                                <div class="field-hint mt-2">
                                    Déjalo vacío si este producto solo se vende por unidad. Al vender, el cajero podrá elegir vender por unidad, blíster o caja completa.
                                </div>
                            </div>
                        </div>

                        <!-- Fecha vencimiento -->
                        <div class="mb-4">
                            <label class="field-label">Fecha de vencimiento <span>*</span></label>
                            <input type="date" class="form-input" th:field="*{fechaVencimiento}" required/>
                            <div class="field-hint">Fecha de expiración del producto</div>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn-guardar"><i class="bi bi-check-lg"></i>Guardar Producto</button>
                            <a href="/productos" class="btn-cancelar"><i class="bi bi-arrow-left"></i>Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    if (localStorage.getItem('tema') === 'oscuro') { document.body.classList.add('modo-oscuro'); }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
