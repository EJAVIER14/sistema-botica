<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .producto-sugerencias {
            position: absolute;
            z-index: 1000;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 0 0 8px 8px;
            background: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .sugerencia-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .sugerencia-item:hover { background: #e8f5e9; }
        .producto-busqueda { position: relative; }
    </style>
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">🛒 Nueva Venta</h5>
                </div>
                <div class="card-body p-4">
                    <form action="/ventas/guardar" method="post" id="formVenta">

                        <!-- Cliente -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre del cliente</label>
                            <input type="text" name="cliente" class="form-control" placeholder="Ej: Juan Pérez"/>
                        </div>

                        <!-- DNI y RUC -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">DNI</label>
                                <input type="text" name="dni" class="form-control"
                                       placeholder="Ej: 12345678" maxlength="8"
                                       oninput="this.value=this.value.replace(/[^0-9]/g,'')"/>
                                <small class="text-muted">Solo números, 8 dígitos</small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">RUC <span class="text-muted fw-normal">(opcional)</span></label>
                                <input type="text" name="ruc" class="form-control"
                                       placeholder="Ej: 20512345678" maxlength="11"
                                       oninput="this.value=this.value.replace(/[^0-9]/g,'')"/>
                                <small class="text-muted">Solo números, 11 dígitos</small>
                            </div>
                        </div>

                        <!-- Datos de productos en JSON para búsqueda -->
                        <script th:inline="javascript">
                            const todosProductos = /*[[${productos}]]*/ [];
                        </script>

                        <!-- Productos -->
                        <label class="form-label fw-bold">Productos</label>
                        <div id="productos-container"></div>

                        <button type="button" class="btn btn-warning btn-sm mb-3" onclick="agregarFila()">
                            + Agregar otro producto
                        </button>

                        <hr/>

                        <!-- Descuento y forma de pago -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Descuento (S/)</label>
                                <input type="number" name="descuento" id="descuento"
                                       class="form-control" step="0.01" value="0"
                                       oninput="calcularTotal()"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Forma de pago</label>
                                <select name="formaPago" class="form-select" onchange="manejarFormaPago(this)">
                                    <option value="Efectivo">💵 Efectivo</option>
                                    <option value="Tarjeta">💳 Tarjeta</option>
                                    <option value="Yape/Plin">📱 Yape/Plin</option>
                                </select>
                            </div>
                        </div>

                        <!-- Monto recibido -->
                        <div class="mb-3" id="fila-monto">
                            <label class="form-label fw-bold">Monto recibido (S/)</label>
                            <input type="number" name="montoRecibido" id="montoRecibido"
                                   class="form-control" step="0.01" value="0"
                                   oninput="calcularVuelto()"/>
                        </div>

                        <!-- Resumen -->
                        <div class="card bg-light border-0 p-3 mb-3">
                            <div class="d-flex justify-content-between mb-1">
                                <span class="text-muted">Subtotal (sin IGV):</span>
                                <span id="txt-subtotal" class="fw-bold">S/ 0.00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-1">
                                <span class="text-muted">IGV (18%):</span>
                                <span id="txt-igv" class="fw-bold">S/ 0.00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-1">
                                <span class="text-muted">Descuento:</span>
                                <span id="txt-descuento" class="fw-bold text-danger">- S/ 0.00</span>
                            </div>
                            <hr class="my-1"/>
                            <div class="d-flex justify-content-between mb-1">
                                <span class="fw-bold fs-5">Total:</span>
                                <span id="txt-total" class="fw-bold fs-5 text-success">S/ 0.00</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="text-muted">Vuelto:</span>
                                <span id="txt-vuelto" class="fw-bold text-primary">S/ 0.00</span>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" id="btn-registrar" class="btn btn-success btn-lg">
                                ✅ Registrar Venta
                            </button>
                            <a href="/ventas" class="btn btn-secondary btn-lg">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Campos ocultos para enviar al servidor
    let productosSeleccionados = [];

    function agregarFila(productoInicial = null) {
        const container = document.getElementById('productos-container');
        const index = container.children.length;

        const fila = document.createElement('div');
        fila.className = 'producto-fila mb-3 p-3 border rounded bg-white';
        fila.innerHTML = `
            <div class="row align-items-start g-2">
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted">🔍 Buscar producto</label>
                    <div class="producto-busqueda">
                        <input type="text"
                               class="form-control busqueda-input"
                               placeholder="Escribe el nombre del producto..."
                               autocomplete="off"
                               oninput="buscarProducto(this)"/>
                        <div class="producto-sugerencias d-none"></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Cantidad</label>
                    <input type="number" name="cantidades"
                           class="form-control cantidad-input"
                           min="1" value="1"
                           oninput="validarStock(this); calcularTotal();"
                           disabled/>
                    <small class="text-danger stock-error d-none">⚠️ Stock insuficiente</small>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold text-muted">Precio</label>
                    <input type="text" class="form-control precio-display bg-light" readonly placeholder="S/ 0.00"/>
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-danger btn-sm"
                            onclick="eliminarFila(this)" title="Eliminar">🗑️</button>
                </div>
            </div>
            <div class="mt-2">
                <span class="producto-info text-muted small"></span>
            </div>
            <input type="hidden" name="productoIds" value="" class="producto-id-hidden"/>
        `;

        container.appendChild(fila);
        calcularTotal();
    }

    function buscarProducto(input) {
        const fila = input.closest('.producto-fila');
        const sugerencias = fila.querySelector('.producto-sugerencias');
        const texto = input.value.toLowerCase().trim();

        if (texto.length < 1) {
            sugerencias.classList.add('d-none');
            return;
        }

        const productos = todosProductos.filter(p =>
            p.nombre.toLowerCase().includes(texto)
        );

        if (productos.length === 0) {
            sugerencias.innerHTML = '<div class="sugerencia-item text-muted">No se encontraron productos</div>';
            sugerencias.classList.remove('d-none');
            return;
        }

        sugerencias.innerHTML = productos.map(p => `
            <div class="sugerencia-item"
                 onclick="seleccionarProducto(this, ${p.id}, '${p.nombre}', ${p.precio}, ${p.stock})">
                <strong>${p.nombre}</strong>
                <span class="float-end">
                    <span class="badge ${p.stock < 10 ? 'bg-danger' : 'bg-success'}">
                        Stock: ${p.stock}
                    </span>
                    <span class="text-success fw-bold ms-2">S/ ${p.precio}</span>
                </span>
            </div>
        `).join('');

        sugerencias.classList.remove('d-none');
    }

    function seleccionarProducto(el, id, nombre, precio, stock) {
        const fila = el.closest('.producto-fila');
        const sugerencias = fila.querySelector('.producto-sugerencias');
        const busquedaInput = fila.querySelector('.busqueda-input');
        const cantidadInput = fila.querySelector('.cantidad-input');
        const precioDisplay = fila.querySelector('.precio-display');
        const productoInfo = fila.querySelector('.producto-info');
        const hiddenId = fila.querySelector('.producto-id-hidden');

        busquedaInput.value = nombre;
        hiddenId.value = id;
        cantidadInput.max = stock;
        cantidadInput.disabled = false;
        cantidadInput.value = 1;
        precioDisplay.value = 'S/ ' + precio.toFixed(2);
        productoInfo.innerHTML = `✅ <strong>${nombre}</strong> — Stock disponible: <strong>${stock}</strong> unidades`;

        // Guardar datos en dataset
        cantidadInput.dataset.precio = precio;
        cantidadInput.dataset.stock = stock;

        sugerencias.classList.add('d-none');
        calcularTotal();
    }

    function eliminarFila(btn) {
        const container = document.getElementById('productos-container');
        if (container.children.length > 1) {
            btn.closest('.producto-fila').remove();
            calcularTotal();
        }
    }

    function validarStock(input) {
        const stock = parseInt(input.dataset.stock) || 0;
        const cantidad = parseInt(input.value) || 0;
        const errorMsg = input.closest('.producto-fila').querySelector('.stock-error');
        const btnRegistrar = document.getElementById('btn-registrar');

        if (cantidad > stock) {
            input.classList.add('is-invalid');
            errorMsg.classList.remove('d-none');
            errorMsg.textContent = '⚠️ Stock disponible: ' + stock;
            btnRegistrar.disabled = true;
        } else {
            input.classList.remove('is-invalid');
            errorMsg.classList.add('d-none');
            btnRegistrar.disabled = false;
        }
    }

    function calcularTotal() {
        let subtotalBruto = 0;
        document.querySelectorAll('.producto-fila').forEach(fila => {
            const cantidad = fila.querySelector('.cantidad-input');
            const precio = parseFloat(cantidad?.dataset.precio) || 0;
            subtotalBruto += precio * (parseFloat(cantidad?.value) || 0);
        });

        const descuento = parseFloat(document.getElementById('descuento').value) || 0;
        const subtotalConDescuento = subtotalBruto - descuento;
        const subtotalSinIgv = subtotalConDescuento / 1.18;
        const igv = subtotalConDescuento - subtotalSinIgv;
        const total = subtotalConDescuento;

        document.getElementById('txt-subtotal').textContent = 'S/ ' + subtotalSinIgv.toFixed(2);
        document.getElementById('txt-igv').textContent = 'S/ ' + igv.toFixed(2);
        document.getElementById('txt-descuento').textContent = '- S/ ' + descuento.toFixed(2);
        document.getElementById('txt-total').textContent = 'S/ ' + total.toFixed(2);

        const formaPago = document.querySelector('select[name=formaPago]').value;
        if (formaPago !== 'Efectivo') {
            document.getElementById('montoRecibido').value = total.toFixed(2);
        }
        calcularVuelto();
    }

    function calcularVuelto() {
        const total = parseFloat(document.getElementById('txt-total').textContent.replace('S/ ', '')) || 0;
        const recibido = parseFloat(document.getElementById('montoRecibido').value) || 0;
        document.getElementById('txt-vuelto').textContent = 'S/ ' + (recibido >= total ? (recibido - total).toFixed(2) : '0.00');
    }

    function manejarFormaPago(select) {
        const total = parseFloat(document.getElementById('txt-total').textContent.replace('S/ ', '')) || 0;
        const montoInput = document.getElementById('montoRecibido');
        const filaMonto = document.getElementById('fila-monto');
        if (select.value !== 'Efectivo') {
            montoInput.value = total.toFixed(2);
            filaMonto.style.opacity = '0.6';
        } else {
            filaMonto.style.opacity = '1';
            montoInput.value = '0';
        }
        calcularVuelto();
    }

    // Cerrar sugerencias al hacer clic fuera
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.producto-busqueda')) {
            document.querySelectorAll('.producto-sugerencias').forEach(s => s.classList.add('d-none'));
        }
    });

    // Iniciar con una fila
    window.onload = function() { agregarFila(); };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
