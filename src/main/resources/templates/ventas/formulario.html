<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">🛒 Nueva Venta</h5>
                </div>
                <div class="card-body p-4">
                    <form action="/ventas/guardar" method="post" id="formVenta">

                        <!-- Cliente -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre del cliente</label>
                            <input type="text" name="cliente"
                                   class="form-control"
                                   placeholder="Ej: Juan Pérez"/>
                        </div>

                        <!-- DNI y RUC -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">DNI</label>
                                <input type="text"
                                       name="dni"
                                       class="form-control"
                                       placeholder="Ej: 12345678"
                                       maxlength="8"
                                       oninput="this.value=this.value.replace(/[^0-9]/g,'')"/>
                                <small class="text-muted">Solo números, 8 dígitos</small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">RUC <span class="text-muted fw-normal">(opcional)</span></label>
                                <input type="text"
                                       name="ruc"
                                       class="form-control"
                                       placeholder="Ej: 20512345678"
                                       maxlength="11"
                                       oninput="this.value=this.value.replace(/[^0-9]/g,'')"/>
                                <small class="text-muted">Solo números, 11 dígitos</small>
                            </div>
                        </div>

                        <!-- Productos -->
                        <label class="form-label fw-bold">Productos</label>
                        <div id="productos-container">
                            <div class="row mb-2 producto-fila">
                                <div class="col-8">
                                    <select name="productoIds"
                                            class="form-select"
                                            onchange="actualizarStock(this); calcularTotal();">
                                        <option th:each="p : ${productos}"
                                                th:value="${p.id}"
                                                th:text="${p.nombre} + ' (Stock: ' + ${p.stock} + ') - S/ ' + ${p.precio}"
                                                th:attr="data-precio=${p.precio}, data-stock=${p.stock}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <input type="number"
                                           name="cantidades"
                                           class="form-control cantidad-input"
                                           placeholder="Cantidad"
                                           min="1" value="1"
                                           oninput="validarStock(this); calcularTotal();"/>
                                    <small class="text-danger stock-error d-none">
                                        ⚠️ Stock insuficiente
                                    </small>
                                </div>
                            </div>
                        </div>

                        <button type="button"
                                class="btn btn-warning btn-sm mb-3"
                                onclick="agregarProducto()">
                            + Agregar otro producto
                        </button>

                        <hr/>

                        <!-- Descuento y forma de pago -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Descuento (S/)</label>
                                <input type="number"
                                       name="descuento"
                                       id="descuento"
                                       class="form-control"
                                       step="0.01"
                                       value="0"
                                       oninput="calcularTotal()"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Forma de pago</label>
                                <select name="formaPago" class="form-select"
                                        onchange="manejarFormaPago(this)">
                                    <option value="Efectivo">💵 Efectivo</option>
                                    <option value="Tarjeta">💳 Tarjeta</option>
                                    <option value="Yape/Plin">📱 Yape/Plin</option>
                                </select>
                            </div>
                        </div>

                        <!-- Monto recibido -->
                        <div class="mb-3" id="fila-monto">
                            <label class="form-label fw-bold">Monto recibido (S/)</label>
                            <input type="number"
                                   name="montoRecibido"
                                   id="montoRecibido"
                                   class="form-control"
                                   step="0.01"
                                   value="0"
                                   oninput="calcularVuelto()"/>
                        </div>

                        <!-- Resumen de totales -->
                        <div class="card bg-light border-0 p-3 mb-3">
                            <div class="d-flex justify-content-between mb-1">
                                <span class="text-muted">Subtotal (sin IGV):</span>
                                <span id="txt-subtotal" class="fw-bold">S/ 0.00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-1">
                                <span class="text-muted">IGV (18%):</span>
                                <span id="txt-igv" class="fw-bold">S/ 0.00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-1">
                                <span class="text-muted">Descuento:</span>
                                <span id="txt-descuento" class="fw-bold text-danger">- S/ 0.00</span>
                            </div>
                            <hr class="my-1"/>
                            <div class="d-flex justify-content-between mb-1">
                                <span class="fw-bold fs-5">Total:</span>
                                <span id="txt-total" class="fw-bold fs-5 text-success">S/ 0.00</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="text-muted">Vuelto:</span>
                                <span id="txt-vuelto" class="fw-bold text-primary">S/ 0.00</span>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" id="btn-registrar"
                                    class="btn btn-success btn-lg">
                                ✅ Registrar Venta
                            </button>
                            <a href="/ventas" class="btn btn-secondary btn-lg">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function actualizarStock(select) {
        const fila = select.closest('.producto-fila');
        const input = fila.querySelector('.cantidad-input');
        const stockDisponible = parseInt(
            select.options[select.selectedIndex].getAttribute('data-stock')) || 0;
        input.max = stockDisponible;
        validarStock(input);
    }

    function validarStock(input) {
        const fila = input.closest('.producto-fila');
        const select = fila.querySelector('select');
        const stockDisponible = parseInt(
            select.options[select.selectedIndex].getAttribute('data-stock')) || 0;
        const cantidad = parseInt(input.value) || 0;
        const errorMsg = fila.querySelector('.stock-error');
        const btnRegistrar = document.getElementById('btn-registrar');

        if (cantidad > stockDisponible) {
            input.classList.add('is-invalid');
            errorMsg.classList.remove('d-none');
            errorMsg.textContent = '⚠️ Stock disponible: ' + stockDisponible;
            btnRegistrar.disabled = true;
        } else {
            input.classList.remove('is-invalid');
            errorMsg.classList.add('d-none');
            btnRegistrar.disabled = false;
        }
    }

    function calcularTotal() {
        let subtotalBruto = 0;
        const filas = document.querySelectorAll('.producto-fila');

        filas.forEach(fila => {
            const select = fila.querySelector('select');
            const cantidad = fila.querySelector('input[type=number]');
            if (select && cantidad) {
                const precio = parseFloat(
                    select.options[select.selectedIndex]
                        .getAttribute('data-precio')) || 0;
                subtotalBruto += precio * parseFloat(cantidad.value || 0);
            }
        });

        const descuento = parseFloat(
            document.getElementById('descuento').value) || 0;
        const subtotalConDescuento = subtotalBruto - descuento;
        const subtotalSinIgv = subtotalConDescuento / 1.18;
        const igv = subtotalConDescuento - subtotalSinIgv;
        const total = subtotalConDescuento;

        document.getElementById('txt-subtotal').textContent =
            'S/ ' + subtotalSinIgv.toFixed(2);
        document.getElementById('txt-igv').textContent =
            'S/ ' + igv.toFixed(2);
        document.getElementById('txt-descuento').textContent =
            '- S/ ' + descuento.toFixed(2);
        document.getElementById('txt-total').textContent =
            'S/ ' + total.toFixed(2);

        const formaPago = document.querySelector('select[name=formaPago]').value;
        if (formaPago !== 'Efectivo') {
            document.getElementById('montoRecibido').value = total.toFixed(2);
        }

        calcularVuelto();
    }

    function calcularVuelto() {
        const totalText = document.getElementById('txt-total')
            .textContent.replace('S/ ', '');
        const total = parseFloat(totalText) || 0;
        const recibido = parseFloat(
            document.getElementById('montoRecibido').value) || 0;
        const vuelto = recibido - total;

        document.getElementById('txt-vuelto').textContent =
            'S/ ' + (vuelto >= 0 ? vuelto.toFixed(2) : '0.00');
    }

    function manejarFormaPago(select) {
        const totalText = document.getElementById('txt-total')
            .textContent.replace('S/ ', '');
        const total = parseFloat(totalText) || 0;
        const filaMonto = document.getElementById('fila-monto');
        const montoInput = document.getElementById('montoRecibido');

        if (select.value !== 'Efectivo') {
            montoInput.value = total.toFixed(2);
            filaMonto.style.opacity = '0.6';
        } else {
            filaMonto.style.opacity = '1';
            montoInput.value = '0';
        }
        calcularVuelto();
    }

    function agregarProducto() {
        const container = document.getElementById('productos-container');
        const fila = container.children[0].cloneNode(true);
        const nuevaInput = fila.querySelector('.cantidad-input');
        nuevaInput.value = 1;

        const select = fila.querySelector('select');
        select.addEventListener('change', function () {
            actualizarStock(this);
            calcularTotal();
        });
        nuevaInput.addEventListener('input', function () {
            validarStock(this);
            calcularTotal();
        });

        const stockInicial = parseInt(
            select.options[select.selectedIndex].getAttribute('data-stock')) || 0;
        nuevaInput.max = stockInicial;

        container.appendChild(fila);
        calcularTotal();
    }

    window.onload = function () {
        const primerSelect = document.querySelector('.producto-fila select');
        if (primerSelect) actualizarStock(primerSelect);
        calcularTotal();
    };
</script>
</body>
</html>
