<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Nueva Venta</h5>
                </div>
                <div class="card-body p-4">
                    <form action="/ventas/guardar" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Nombre del cliente
                            </label>
                            <input type="text" name="cliente"
                                   class="form-control"
                                   placeholder="Ej: Juan Pérez"/>
                        </div>

                        <label class="form-label fw-bold">
                            Productos
                        </label>
                        <div id="productos-container">
                            <div class="row mb-2 producto-fila">
                                <div class="col-8">
                                    <select name="productoIds"
                                            class="form-select">
                                        <option th:each="p : ${productos}"
                                                th:value="${p.id}"
                                                th:text="${p.nombre} + ' (Stock: ' + ${p.stock} + ') - S/ ' + ${p.precio}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <input type="number"
                                           name="cantidades"
                                           class="form-control"
                                           placeholder="Cantidad"
                                           min="1" value="1"/>
                                </div>
                            </div>
                        </div>

                        <button type="button"
                                class="btn btn-warning btn-sm mb-3"
                                onclick="agregarProducto()">
                            + Agregar otro producto
                        </button>

                        <div class="d-flex gap-2 mt-3">
                            <button type="submit"
                                    class="btn btn-success">
                                Registrar Venta
                            </button>
                            <a href="/ventas"
                               class="btn btn-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function agregarProducto() {
        const container = document.getElementById('productos-container');
        const fila = container.children[0].cloneNode(true);
        container.appendChild(fila);
    }
</script>
</body>
</html>
