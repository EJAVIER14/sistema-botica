<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { transition: background 0.3s, color 0.3s; }
        .producto-card {
            cursor: pointer;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            transition: all 0.2s;
        }
        .producto-card:hover {
            border-color: #2E7D32;
            background: #e8f5e9;
            transform: translateY(-2px);
        }
        .carrito-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
        }
        .panel-izquierdo {
            height: calc(100vh - 80px);
            overflow-y: auto;
        }
        .panel-derecho {
            height: calc(100vh - 80px);
            overflow-y: auto;
            background: white;
            border-left: 2px solid #e0e0e0;
            padding: 16px;
        }
        .badge-stock-bajo { background-color: #ff9800; }
        .btn-cantidad {
            width: 28px; height: 28px;
            padding: 0;
            font-size: 16px;
            line-height: 1;
        }

        /* ═══ MODO OSCURO ═══ */
        body.modo-oscuro { background: #121212; color: #e0e0e0; }
        body.modo-oscuro .panel-derecho { background-color: #1e1e1e !important; border-left-color: #333 !important; }
        body.modo-oscuro .producto-card { background-color: #1e1e1e !important; border-color: #333 !important; }
        body.modo-oscuro .producto-card:hover { background-color: #1b3320 !important; }
        body.modo-oscuro .carrito-item { background-color: #2a2a2a !important; }
        body.modo-oscuro .form-control { background-color: #2a2a2a !important; color: #e0e0e0 !important; border-color: #404040 !important; }
        body.modo-oscuro .bg-light { background-color: #2a2a2a !important; }
        body.modo-oscuro .text-muted { color: #9e9e9e !important; }
        body.modo-oscuro hr { border-color: #333 !important; }
    </style>
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<!-- Datos de productos -->
<script th:inline="javascript">
    const todosProductos = /*[[${productos}]]*/ [];
</script>

<div class="container-fluid px-0">
    <div class="row g-0">

        <!-- ═══ PANEL IZQUIERDO — Buscador y productos ═══ -->
        <div class="col-md-7 panel-izquierdo p-3">
            <h5 class="fw-bold text-success mb-3">🛒 Nueva Venta</h5>

            <!-- Buscador -->
            <div class="input-group mb-3">
                <span class="input-group-text bg-success text-white">🔍</span>
                <input type="text" id="buscador" class="form-control form-control-lg"
                       placeholder="Buscar producto por nombre..."
                       oninput="filtrarProductos(this.value)"
                       autocomplete="off"/>
            </div>

            <!-- Grid de productos -->
            <div class="row g-2" id="grid-productos">
                <!-- Se llena dinámicamente -->
            </div>
        </div>

        <!-- ═══ PANEL DERECHO — Carrito y cobro ═══ -->
        <div class="col-md-5 panel-derecho">

            <!-- Formulario oculto que se envía -->
            <form action="/ventas/guardar" method="post" id="formVenta">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="cliente" id="h-cliente"/>
                <input type="hidden" name="dni" id="h-dni"/>
                <input type="hidden" name="ruc" id="h-ruc"/>
                <input type="hidden" name="descuento" id="h-descuento" value="0"/>
                <input type="hidden" name="formaPago" id="h-formaPago" value="Efectivo"/>
                <input type="hidden" name="montoRecibido" id="h-montoRecibido" value="0"/>
                <div id="hidden-productos"></div>
            </form>

            <!-- Cliente -->
            <h6 class="fw-bold text-muted mb-2">👤 Datos del cliente</h6>
            <input type="text" id="cliente" class="form-control form-control-sm mb-2"
                   placeholder="Nombre del cliente" oninput="document.getElementById('h-cliente').value=this.value"/>
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <input type="text" id="dni" class="form-control form-control-sm"
                           placeholder="DNI (8 dígitos)" maxlength="8"
                           oninput="this.value=this.value.replace(/[^0-9]/g,''); document.getElementById('h-dni').value=this.value"/>
                </div>
                <div class="col-6">
                    <input type="text" id="ruc" class="form-control form-control-sm"
                           placeholder="RUC (opcional)" maxlength="11"
                           oninput="this.value=this.value.replace(/[^0-9]/g,''); document.getElementById('h-ruc').value=this.value"/>
                </div>
            </div>

            <hr/>

            <!-- Carrito -->
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="fw-bold mb-0">🧺 Carrito</h6>
                <span class="badge bg-success" id="total-items">0 items</span>
            </div>

            <div id="carrito-items">
                <div class="text-muted text-center py-3 small" id="carrito-vacio">
                    Selecciona productos del panel izquierdo
                </div>
            </div>

            <hr/>

            <!-- Descuento -->
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label small fw-bold">Descuento (S/)</label>
                    <input type="number" id="descuento" class="form-control form-control-sm"
                           value="0" step="0.01" min="0"
                           oninput="document.getElementById('h-descuento').value=this.value; calcularTotal()"/>
                </div>
                <div class="col-6">
                    <label class="form-label small fw-bold">Forma de pago</label>
                    <div class="d-flex gap-1">
                        <button type="button" class="btn btn-success btn-sm flex-fill pago-btn active"
                                onclick="setPago('Efectivo', this)">💵</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm flex-fill pago-btn"
                                onclick="setPago('Tarjeta', this)">💳</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm flex-fill pago-btn"
                                onclick="setPago('Yape/Plin', this)">📱</button>
                    </div>
                </div>
            </div>

            <!-- Monto recibido -->
            <div class="mb-2">
                <label class="form-label small fw-bold">Monto recibido (S/)</label>
                <input type="number" id="montoRecibido" class="form-control form-control-sm"
                       value="0" step="0.01"
                       oninput="document.getElementById('h-montoRecibido').value=this.value; calcularVuelto()"/>
            </div>

            <!-- Totales -->
            <div class="bg-light rounded p-3 mb-3">
                <div class="d-flex justify-content-between small mb-1">
                    <span class="text-muted">Subtotal (sin IGV):</span>
                    <span id="txt-subtotal" class="fw-bold">S/ 0.00</span>
                </div>
                <div class="d-flex justify-content-between small mb-1">
                    <span class="text-muted">IGV (18%):</span>
                    <span id="txt-igv" class="fw-bold">S/ 0.00</span>
                </div>
                <div class="d-flex justify-content-between small mb-1">
                    <span class="text-muted">Descuento:</span>
                    <span id="txt-descuento" class="fw-bold text-danger">- S/ 0.00</span>
                </div>
                <hr class="my-1"/>
                <div class="d-flex justify-content-between mb-1">
                    <span class="fw-bold">Total:</span>
                    <span id="txt-total" class="fw-bold fs-5 text-success">S/ 0.00</span>
                </div>
                <div class="d-flex justify-content-between small">
                    <span class="text-muted">Vuelto:</span>
                    <span id="txt-vuelto" class="fw-bold text-primary">S/ 0.00</span>
                </div>
            </div>

            <!-- Botones -->
            <div class="d-grid gap-2">
                <button type="button" class="btn btn-success btn-lg"
                        onclick="registrarVenta()">
                    ✅ Cobrar y registrar venta
                </button>
                <a href="/ventas" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </div>
    </div>
</div>

<script>
    let carrito = {}; // { id: { nombre, precio, stock, cantidad } }

    // Renderizar grid de productos
    function renderizarProductos(lista) {
        const grid = document.getElementById('grid-productos');
        if (lista.length === 0) {
            grid.innerHTML = '<div class="col-12 text-muted text-center py-4">No se encontraron productos</div>';
            return;
        }
        grid.innerHTML = lista.map(p => `
            <div class="col-6 col-lg-4">
                <div class="producto-card p-2 text-center" onclick="agregarAlCarrito(${p.id}, '${p.nombre}', ${p.precio}, ${p.stock})">
                    <div class="fs-3 mb-1">💊</div>
                    <div class="fw-bold small">${p.nombre}</div>
                    <div class="text-success fw-bold">S/ ${p.precio.toFixed(2)}</div>
                    <span class="badge ${p.stock < 10 ? 'bg-warning text-dark' : 'bg-success'} mt-1">
                        Stock: ${p.stock}
                    </span>
                </div>
            </div>
        `).join('');
    }

    function filtrarProductos(texto) {
        const filtrados = todosProductos.filter(p =>
            p.nombre.toLowerCase().includes(texto.toLowerCase())
        );
        renderizarProductos(filtrados);
    }

    function agregarAlCarrito(id, nombre, precio, stock) {
        if (stock <= 0) {
            alert('⚠️ ' + nombre + ' no tiene stock disponible');
            return;
        }
        if (carrito[id]) {
            if (carrito[id].cantidad >= stock) {
                alert('⚠️ Stock máximo alcanzado: ' + stock + ' unidades');
                return;
            }
            carrito[id].cantidad++;
        } else {
            carrito[id] = { nombre, precio, stock, cantidad: 1 };
        }
        renderizarCarrito();
        calcularTotal();
    }

    function cambiarCantidad(id, delta) {
        if (!carrito[id]) return;
        carrito[id].cantidad += delta;
        if (carrito[id].cantidad <= 0) {
            delete carrito[id];
        } else if (carrito[id].cantidad > carrito[id].stock) {
            carrito[id].cantidad = carrito[id].stock;
        }
        renderizarCarrito();
        calcularTotal();
    }

    function eliminarDelCarrito(id) {
        delete carrito[id];
        renderizarCarrito();
        calcularTotal();
    }

    function renderizarCarrito() {
        const container = document.getElementById('carrito-items');
        const vacio = document.getElementById('carrito-vacio');
        const ids = Object.keys(carrito);

        if (ids.length === 0) {
            container.innerHTML = '<div class="text-muted text-center py-3 small">Selecciona productos del panel izquierdo</div>';
            document.getElementById('total-items').textContent = '0 items';
            return;
        }

        document.getElementById('total-items').textContent = ids.length + ' items';
        container.innerHTML = ids.map(id => {
            const item = carrito[id];
            return `
                <div class="carrito-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="small fw-bold">${item.nombre}</div>
                        <button type="button" class="btn btn-link btn-sm text-danger p-0"
                                onclick="eliminarDelCarrito(${id})">✕</button>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-1">
                        <div class="d-flex align-items-center gap-2">
                            <button type="button" class="btn btn-outline-secondary btn-cantidad"
                                    onclick="cambiarCantidad(${id}, -1)">−</button>
                            <span class="fw-bold">${item.cantidad}</span>
                            <button type="button" class="btn btn-outline-success btn-cantidad"
                                    onclick="cambiarCantidad(${id}, 1)">+</button>
                        </div>
                        <div class="text-success fw-bold">
                            S/ ${(item.precio * item.cantidad).toFixed(2)}
                        </div>
                    </div>
                    <div class="text-muted" style="font-size:11px">
                        S/ ${item.precio.toFixed(2)} x ${item.cantidad}
                    </div>
                </div>
            `;
        }).join('');
    }

    function calcularTotal() {
        let subtotalBruto = 0;
        Object.values(carrito).forEach(item => {
            subtotalBruto += item.precio * item.cantidad;
        });

        const descuento = parseFloat(document.getElementById('descuento').value) || 0;
        const subtotalConDescuento = subtotalBruto - descuento;
        const subtotalSinIgv = subtotalConDescuento / 1.18;
        const igv = subtotalConDescuento - subtotalSinIgv;
        const total = subtotalConDescuento;

        document.getElementById('txt-subtotal').textContent = 'S/ ' + subtotalSinIgv.toFixed(2);
        document.getElementById('txt-igv').textContent = 'S/ ' + igv.toFixed(2);
        document.getElementById('txt-descuento').textContent = '- S/ ' + descuento.toFixed(2);
        document.getElementById('txt-total').textContent = 'S/ ' + total.toFixed(2);

        document.getElementById('h-montoRecibido').value = total.toFixed(2);
        document.getElementById('montoRecibido').value = total.toFixed(2);
        calcularVuelto();
    }

    function calcularVuelto() {
        const total = parseFloat(document.getElementById('txt-total').textContent.replace('S/ ', '')) || 0;
        const recibido = parseFloat(document.getElementById('montoRecibido').value) || 0;
        document.getElementById('txt-vuelto').textContent = 'S/ ' + (recibido >= total ? (recibido - total).toFixed(2) : '0.00');
        document.getElementById('h-montoRecibido').value = recibido;
    }

    function setPago(tipo, btn) {
        document.querySelectorAll('.pago-btn').forEach(b => {
            b.classList.remove('btn-success');
            b.classList.add('btn-outline-secondary');
        });
        btn.classList.remove('btn-outline-secondary');
        btn.classList.add('btn-success');
        document.getElementById('h-formaPago').value = tipo;
    }

    function registrarVenta() {
        if (Object.keys(carrito).length === 0) {
            alert('⚠️ Agrega al menos un producto al carrito');
            return;
        }

        // Llenar campos ocultos
        const hiddenContainer = document.getElementById('hidden-productos');
        hiddenContainer.innerHTML = '';
        Object.entries(carrito).forEach(([id, item]) => {
            hiddenContainer.innerHTML += `
                <input type="hidden" name="productoIds" value="${id}"/>
                <input type="hidden" name="cantidades" value="${item.cantidad}"/>
            `;
        });

        document.getElementById('formVenta').submit();
    }

    // Inicializar
    window.onload = function() {
        if (localStorage.getItem('tema') === 'oscuro') { document.body.classList.add('modo-oscuro'); }
        renderizarProductos(todosProductos);
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
