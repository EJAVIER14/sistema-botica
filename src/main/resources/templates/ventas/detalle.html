<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <h2 class="fw-bold text-success mb-4">
        🛒 Detalle de Venta #
        <span th:text="${venta.id}"></span>
    </h2>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <p><strong>Cliente:</strong>
                <span th:text="${venta.cliente}"></span></p>
            <p class="mb-0"><strong>Fecha:</strong>
                <span th:text="${#temporals.format(venta.fecha,'dd/MM/yyyy HH:mm')}"></span></p>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-success">
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio Unit.</th>
                    <th>Subtotal</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="d : ${venta.detalles}">
                    <td th:text="${d.producto.nombre}"></td>
                    <td th:text="${d.cantidad}"></td>
                    <td th:text="'S/ ' + ${d.precioUnitario}"></td>
                    <td th:text="'S/ ' + ${d.subtotal}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center">
        <h4 class="fw-bold text-success">
            Total: S/ <span th:text="${venta.total}"></span>
        </h4>
        <a href="/ventas" class="btn btn-secondary">
            ← Volver a ventas
        </a>
    </div>
</div>
</body>
</html>
