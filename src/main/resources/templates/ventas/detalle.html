<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none !important; }
            .boleta { max-width: 300px; margin: auto; }
        }
    </style>
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}" class="no-print"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <!-- Boleta -->
            <div class="card shadow-sm border-0 boleta" id="boleta">
                <div class="card-body p-4">

                    <!-- Encabezado -->
                    <div class="text-center mb-3">
                        <h4 class="fw-bold text-success mb-0">
                            💊 Sistema Botica
                        </h4>
                        <p class="text-muted small mb-0">
                            Botica del Pueblo
                        </p>
                        <hr/>
                        <h5 class="fw-bold">BOLETA DE VENTA</h5>
                        <p class="text-muted small mb-0"
                           th:text="'N° ' + ${venta.id}"></p>
                        <p class="text-muted small"
                           th:text="${#temporals.format(
                           venta.fecha,'dd/MM/yyyy HH:mm')}">
                        </p>
                    </div>

                    <!-- Datos del cliente -->
                    <div class="mb-3">
                        <p class="mb-1 small">
                            <strong>Cliente:</strong>
                            <span th:text="${venta.cliente}"></span>
                        </p>
                        <p class="mb-0 small">
                            <strong>Forma de pago:</strong>
                            <span th:text="${venta.formaPago}"></span>
                        </p>
                    </div>

                    <hr/>

                    <!-- Productos -->
                    <table class="table table-sm mb-0">
                        <thead>
                        <tr>
                            <th class="small">Producto</th>
                            <th class="small text-center">Cant.</th>
                            <th class="small text-end">P.Unit</th>
                            <th class="small text-end">Total</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${venta.detalles}">
                            <td class="small"
                                th:text="${d.producto.nombre}">
                            </td>
                            <td class="small text-center"
                                th:text="${d.cantidad}">
                            </td>
                            <td class="small text-end"
                                th:text="'S/ ' + ${d.precioUnitario}">
                            </td>
                            <td class="small text-end"
                                th:text="'S/ ' + ${d.subtotal}">
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <hr/>

                    <!-- Totales -->
                    <div class="d-flex justify-content-between small mb-1">
                        <span>Subtotal (sin IGV):</span>
                        <span th:text="'S/ ' + ${venta.subtotal}"></span>
                    </div>
                    <div class="d-flex justify-content-between small mb-1">
                        <span>IGV (18%):</span>
                        <span th:text="'S/ ' + ${venta.igv}"></span>
                    </div>
                    <div class="d-flex justify-content-between small mb-1"
                         th:if="${venta.descuento > 0}">
                        <span>Descuento:</span>
                        <span class="text-danger"
                              th:text="'- S/ ' + ${venta.descuento}">
                        </span>
                    </div>
                    <hr/>
                    <div class="d-flex justify-content-between fw-bold mb-1">
                        <span>TOTAL:</span>
                        <span class="text-success"
                              th:text="'S/ ' + ${venta.total}">
                        </span>
                    </div>
                    <div class="d-flex justify-content-between small mb-1">
                        <span>Monto recibido:</span>
                        <span th:text="'S/ ' + ${venta.montoRecibido}"></span>
                    </div>
                    <div class="d-flex justify-content-between small">
                        <span>Vuelto:</span>
                        <span class="text-primary fw-bold"
                              th:text="'S/ ' + ${venta.vuelto}">
                        </span>
                    </div>

                    <hr/>
                    <p class="text-center small text-muted mb-0">
                        ¡Gracias por su compra!
                    </p>
                </div>
            </div>

            <!-- Botones -->
            <div class="d-flex gap-2 mt-3 no-print">
                <button onclick="window.print()"
                        class="btn btn-success">
                    🖨️ Imprimir Boleta
                </button>
                <a href="/ventas"
                   class="btn btn-secondary">
                    ← Volver
                </a>
            </div>

        </div>
    </div>
</div>
</body>
</html>
