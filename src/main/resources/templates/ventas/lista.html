<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">

    <!-- ALERTA DE STOCK BAJO -->
    <div th:if="${alertaStock}"
         class="alert alert-warning alert-dismissible fade show d-flex align-items-center gap-2"
         role="alert">
        <span style="font-size: 1.4rem;">⚠️</span>
        <div>
            <strong>Alerta de Stock Bajo:</strong>
            <span th:text="${alertaStock}"></span>
            <br>
            <small>Considera reabastecer estos productos pronto.</small>
        </div>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-success mb-0">🛒 Ventas</h2>
        <a href="/ventas/nueva" class="btn btn-success">
            + Nueva Venta
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-success">
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>DNI</th>
                    <th>RUC</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="venta : ${ventas}">
                    <td th:text="${venta.id}"></td>
                    <td th:text="${venta.cliente}"></td>
                    <td th:text="${venta.dni != null and venta.dni != '' ? venta.dni : '-'}"></td>
                    <td th:text="${venta.ruc != null and venta.ruc != '' ? venta.ruc : '-'}"></td>
                    <td th:text="${#temporals.format(venta.fecha,'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="'S/ ' + ${venta.total}"></td>
                    <td>
                        <a th:href="@{/ventas/detalle/{id}(id=${venta.id})}"
                           class="btn btn-primary btn-sm">
                            Ver detalle
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
