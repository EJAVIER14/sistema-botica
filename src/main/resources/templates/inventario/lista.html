<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container-fluid py-4 px-3">

    <!-- Alerta éxito -->
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        ✅ <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-success mb-0">📋 Inventario</h2>
        <a href="/inventario/orden/nueva" class="btn btn-success btn-sm">
            + Nueva Orden de Entrada
        </a>
    </div>

    <!-- ÓRDENES DE ENTRADA -->
    <h5 class="fw-bold text-muted mb-3">📦 Órdenes de Entrada</h5>
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-success">
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Proveedor</th>
                        <th>Observación</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="orden : ${ordenes}">
                        <td th:text="${orden.id}"></td>
                        <td th:text="${#temporals.format(orden.fecha,'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${orden.proveedor != null ? orden.proveedor.nombre : '-'}"></td>
                        <td th:text="${orden.observacion}"></td>
                        <td>
                            <span th:if="${orden.estado == 'PENDIENTE'}"
                                  class="badge bg-warning text-dark">⏳ PENDIENTE</span>
                            <span th:if="${orden.estado == 'RECIBIDO'}"
                                  class="badge bg-success">✅ RECIBIDO</span>
                        </td>
                        <td>
                            <form th:if="${orden.estado == 'PENDIENTE'}"
                                  th:action="@{/inventario/orden/recibir/{id}(id=${orden.id})}"
                                  method="post" style="display:inline;">
                                <button type="submit" class="btn btn-success btn-sm"
                                        onclick="return confirm('¿Confirmar recepción de esta orden?')">
                                    ✅ Recibir
                                </button>
                            </form>
                            <span th:if="${orden.estado == 'RECIBIDO'}"
                                  class="text-muted small">Completada</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ordenes)}">
                        <td colspan="6" class="text-center text-muted py-3">No hay órdenes registradas</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- HISTORIAL DE MOVIMIENTOS -->
    <h5 class="fw-bold text-muted mb-3">🔄 Historial de Movimientos</h5>
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-success">
                    <tr>
                        <th>Fecha</th>
                        <th>Producto</th>
                        <th>Tipo</th>
                        <th>Motivo</th>
                        <th>Cantidad</th>
                        <th>Stock Ant.</th>
                        <th>Stock Nuevo</th>
                        <th>Usuario</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="mov : ${movimientos}">
                        <td th:text="${#temporals.format(mov.fecha,'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${mov.producto.nombre}"></td>
                        <td>
                            <span th:if="${mov.tipo == 'ENTRADA'}" class="badge bg-success">⬆️ ENTRADA</span>
                            <span th:if="${mov.tipo == 'SALIDA'}" class="badge bg-danger">⬇️ SALIDA</span>
                        </td>
                        <td th:text="${mov.motivo}"></td>
                        <td th:text="${mov.cantidad}"></td>
                        <td th:text="${mov.stockAnterior}"></td>
                        <td th:text="${mov.stockNuevo}"></td>
                        <td th:text="${mov.usuario}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
