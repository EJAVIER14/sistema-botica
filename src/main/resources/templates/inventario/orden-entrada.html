<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Orden de Entrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; transition: background 0.3s, color 0.3s; }
        body.modo-oscuro { background: #121212; color: #e0e0e0; }
        body.modo-oscuro .card { background-color: #1e1e1e !important; color: #e0e0e0 !important; }
        body.modo-oscuro .form-control,
        body.modo-oscuro .form-select { background-color: #2a2a2a !important; color: #e0e0e0 !important; border-color: #404040 !important; }
        body.modo-oscuro .form-label { color: #c0c0c0 !important; }
        body.modo-oscuro .form-text { color: #888 !important; }
        body.modo-oscuro hr { border-color: #2a2a2a !important; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container-fluid py-4 px-3">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">📦 Nueva Orden de Entrada</h5>
                </div>
                <div class="card-body p-4">

                    <!-- enctype multipart para subir archivos -->
                    <form action="/inventario/orden/guardar"
                          method="post"
                          enctype="multipart/form-data">

                        <!-- Proveedor -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Proveedor</label>
                            <select name="proveedorId" class="form-select" required>
                                <option value="">-- Selecciona un proveedor --</option>
                                <option th:each="p : ${proveedores}"
                                        th:value="${p.id}"
                                        th:text="${p.nombre}">
                                </option>
                            </select>
                        </div>

                        <!-- Observación -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Observación</label>
                            <input type="text" name="observacion"
                                   class="form-control"
                                   placeholder="Ej: Pedido mensual de medicamentos"/>
                        </div>

                        <!-- Productos -->
                        <label class="form-label fw-bold">Productos</label>
                        <div id="productos-container">
                            <div class="row mb-2 producto-fila">
                                <div class="col-8">
                                    <select name="productoIds" class="form-select">
                                        <option th:each="p : ${productos}"
                                                th:value="${p.id}"
                                                th:text="${p.nombre} + ' (Stock: ' + ${p.stock} + ')'">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <input type="number" name="cantidades"
                                           class="form-control"
                                           placeholder="Cantidad"
                                           min="1" value="1" required/>
                                </div>
                            </div>
                        </div>

                        <button type="button" class="btn btn-warning btn-sm mb-3"
                                onclick="agregarProducto()">
                            + Agregar otro producto
                        </button>

                        <hr/>

                        <!-- Foto de mercadería -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                📷 Foto de la mercadería
                            </label>
                            <input type="file" name="foto"
                                   class="form-control"
                                   accept="image/jpeg,image/png,image/jpg"/>
                            <div class="form-text">
                                Formatos permitidos: JPG, PNG. Máx. 5MB
                            </div>
                        </div>

                        <!-- Documento / Factura -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                📄 Documento / Factura del proveedor
                            </label>
                            <input type="file" name="documento"
                                   class="form-control"
                                   accept="application/pdf"/>
                            <div class="form-text">
                                Solo PDF. Máx. 5MB
                            </div>
                        </div>

                        <hr/>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                ✅ Crear Orden
                            </button>
                            <a href="/inventario" class="btn btn-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function agregarProducto() {
        const container = document.getElementById('productos-container');
        const fila = container.children[0].cloneNode(true);
        fila.querySelector('input[type=number]').value = 1;
        container.appendChild(fila);
    }
    if (localStorage.getItem('tema') === 'oscuro') { document.body.classList.add('modo-oscuro'); }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
