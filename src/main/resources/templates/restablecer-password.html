<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restablecer Contraseña - Sistema Botica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f1f8e9; min-height:100vh; display:flex; align-items:center; justify-content:center;">
<div class="card shadow" style="max-width:420px; width:100%; border-radius:16px; border:none;">
    <div class="card-body p-4">
        <h4 class="mb-3" style="color:#1B5E20; font-weight:700;">🔐 Nueva contraseña</h4>

        <div th:if="${exito}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:if="${!exito}" th:action="@{/restablecer-password}" method="post">
            <input type="hidden" name="token" th:value="${token}"/>
            <div class="mb-3">
                <label class="form-label">Nueva contraseña</label>
                <input type="password" name="nuevaPassword" class="form-control" required
                       placeholder="Mínimo 8 caracteres, letra y número"/>
            </div>
            <button type="submit" class="btn w-100" style="background:#2E7D32; color:white;">Restablecer</button>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/login}" class="small text-muted">← Volver al inicio de sesión</a>
        </div>
    </div>
</div>
</body>
</html>
