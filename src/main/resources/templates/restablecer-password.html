<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar Contraseña - Sistema Botica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f1f8e9; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .restablecer-card { max-width: 420px; width: 100%; border-radius: 16px; border: none; }
        .btn-restablecer {
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            color: white; font-weight: 700; border: none;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-restablecer:hover { color: white; }
        input[name="codigo"] {
            letter-spacing: 4px; font-weight: 700; text-align: center; font-size: 18px;
        }
        @media (max-width: 480px) {
            .card-body { padding: 24px 20px !important; }
        }
    </style>
</head>
<body>
<div class="card shadow restablecer-card">
    <div class="card-body p-4">
        <h4 class="mb-3" style="color:#1B5E20; font-weight:700;"><i class="bi bi-key-fill me-1"></i>Recuperar contraseña</h4>

        <div th:if="${mensaje}" class="alert alert-success d-flex align-items-center gap-2">
            <i class="bi bi-check-circle-fill"></i><span th:text="${mensaje}"></span>
        </div>
        <div th:if="${exito}" class="alert alert-success d-flex align-items-center gap-2">
            <i class="bi bi-check-circle-fill"></i><span th:text="${mensaje}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-circle-fill"></i><span th:text="${error}"></span>
        </div>

        <form th:if="${!exito}" th:action="@{/restablecer-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" name="email" class="form-control" th:value="${email}" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Código de 6 dígitos</label>
                <input type="text" name="codigo" class="form-control" maxlength="6" required placeholder="123456" inputmode="numeric"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Nueva contraseña</label>
                <input type="password" name="nuevaPassword" class="form-control" required
                       placeholder="Mínimo 8 caracteres, letra y número"/>
            </div>
            <button type="submit" class="btn btn-restablecer w-100">
                <i class="bi bi-check-lg"></i>Restablecer contraseña
            </button>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/olvide-password}" class="small text-muted d-block mb-1"><i class="bi bi-arrow-repeat"></i> Solicitar un nuevo código</a>
            <a th:href="@{/login}" class="small text-muted">Volver al inicio de sesión</a>
        </div>
    </div>
</div>
</body>
</html>
