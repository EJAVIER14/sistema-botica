<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <h2 class="fw-bold text-success mb-4">📊 Reportes</h2>

    <!-- Resumen del día -->
    <h5 class="text-muted mb-3">Resumen de Hoy</h5>
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm border-start border-success border-4">
                <div class="card-body text-center">
                    <h2 class="text-success fw-bold"
                        th:text="'S/ ' + ${totalHoy}"></h2>
                    <p class="text-muted mb-0">Ingresos de hoy</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card border-0 shadow-sm border-start border-primary border-4">
                <div class="card-body text-center">
                    <h2 class="text-primary fw-bold"
                        th:text="${ventasHoy}"></h2>
                    <p class="text-muted mb-0">
                        Ventas realizadas hoy
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Filtro por fechas -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-success text-white fw-bold">
            🔍 Filtrar Ventas por Fecha
        </div>
        <div class="card-body">
            <form action="/reportes" method="get">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">
                            Fecha inicio
                        </label>
                        <input type="date" name="inicio"
                               class="form-control"
                               th:value="${inicio}"/>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">
                            Fecha fin
                        </label>
                        <input type="date" name="fin"
                               class="form-control"
                               th:value="${fin}"/>
                    </div>
                    <div class="col-md-4">
                        <button type="submit"
                                class="btn btn-primary w-100">
                            Buscar
                        </button>
                    </div>
                </div>
            </form>

            <!-- Resumen del período -->
            <div class="row g-3 mt-3">
                <div class="col-md-6">
                    <div class="card border-0 bg-light">
                        <div class="card-body text-center">
                            <h4 class="text-warning fw-bold"
                                th:text="'S/ ' + ${totalIngresos}">
                            </h4>
                            <p class="text-muted mb-0 small">
                                Total ingresos del período
                            </p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card border-0 bg-light">
                        <div class="card-body text-center">
                            <h4 class="fw-bold"
                                style="color:#9C27B0"
                                th:text="${cantidadVentas}">
                            </h4>
                            <p class="text-muted mb-0 small">
                                Ventas en el período
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lista de ventas -->
            <div class="mt-4">
                <div th:if="${#lists.isEmpty(ventas)}"
                     class="text-muted fst-italic">
                    No hay ventas en el período seleccionado
                </div>
                <table th:unless="${#lists.isEmpty(ventas)}"
                       class="table table-hover">
                    <thead class="table-success">
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Fecha</th>
                        <th>Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="v : ${ventas}">
                        <td th:text="${v.id}"></td>
                        <td th:text="${v.cliente}"></td>
                        <td th:text="${#temporals.format(v.fecha,'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="'S/ ' + ${v.total}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Productos más vendidos -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-success text-white fw-bold">
            🏆 Productos Más Vendidos
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(productosMasVendidos)}"
                 class="p-3 text-muted fst-italic">
                Aún no hay ventas registradas
            </div>
            <table th:unless="${#lists.isEmpty(productosMasVendidos)}"
                   class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Producto</th>
                    <th>Unidades vendidas</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p, i : ${productosMasVendidos}">
                    <td>
                            <span class="badge bg-success"
                                  th:text="${i.index + 1}">
                            </span>
                    </td>
                    <td th:text="${p[0]}"></td>
                    <td>
                            <span class="badge bg-primary"
                                  th:text="${p[1]}">
                            </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
