<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proveedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-success mb-0">🚚 Proveedores</h2>
        <a href="/proveedores/nuevo" class="btn btn-success">
            + Nuevo Proveedor
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-success">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>RUC</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Contacto</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${proveedores}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.ruc}"></td>
                    <td th:text="${p.telefono}"></td>
                    <td th:text="${p.correo}"></td>
                    <td th:text="${p.contacto}"></td>
                    <td>
                        <a th:href="@{/proveedores/editar/{id}(id=${p.id})}"
                           class="btn btn-primary btn-sm me-1">
                            Editar
                        </a>
                        <a th:href="@{/proveedores/eliminar/{id}(id=${p.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Seguro?')">
                            Eliminar
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
