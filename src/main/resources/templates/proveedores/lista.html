<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proveedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .card-main { border-radius: 16px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .tabla-header { background: linear-gradient(135deg, #1B5E20, #2E7D32); }
        .tabla-header th { font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; padding: 14px 16px; border: none; color: white; }
        .tabla-row td { padding: 12px 16px; vertical-align: middle; border-bottom: 1px solid #f0f0f0; }
        .tabla-row:hover { background: #f8fff8; }
        .btn-accion { width: 32px; height: 32px; padding: 0; border-radius: 8px; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
        .search-box { border-radius: 12px; border: 2px solid #e0e0e0; padding: 10px 16px; }
        .search-box:focus { border-color: #2E7D32; box-shadow: 0 0 0 3px rgba(46,125,50,0.1); outline: none; }
        .prov-avatar { width: 38px; height: 38px; border-radius: 10px; background: #e8f5e9; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container-fluid py-4 px-4">

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-0" style="color:#1B5E20">🚚 Gestión de Proveedores</h4>
            <p class="text-muted small mb-0">Administra los proveedores de medicamentos</p>
        </div>
        <a href="/proveedores/nuevo" class="btn btn-success px-4 rounded-pill shadow-sm">+ Nuevo Proveedor</a>
    </div>

    <!-- Buscador -->
    <div class="mb-4">
        <input type="text" class="form-control search-box" style="max-width:400px"
               placeholder="🔍 Buscar por nombre o RUC..."
               oninput="filtrar(this.value)"/>
    </div>

    <!-- Tabla -->
    <div class="card card-main">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0" id="tabla-proveedores">
                    <thead class="tabla-header">
                    <tr>
                        <th>#</th>
                        <th>Proveedor</th>
                        <th>RUC</th>
                        <th>Contacto</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="tabla-row" th:each="p : ${proveedores}">
                        <td><span style="color:#9e9e9e;font-size:12px;font-weight:600" th:text="${p.id}"></span></td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div class="prov-avatar">🏭</div>
                                <div>
                                    <div style="font-weight:600;font-size:14px" th:text="${p.nombre}"></div>
                                </div>
                            </div>
                        </td>
                        <td style="font-size:13px;font-family:monospace;color:#616161" th:text="${p.ruc}"></td>
                        <td style="font-size:13px" th:text="${p.contacto}"></td>
                        <td style="font-size:13px;color:#2E7D32;font-weight:500" th:text="${p.telefono}"></td>
                        <td style="font-size:13px;color:#616161" th:text="${p.correo}"></td>
                        <td>
                            <div class="d-flex gap-1">
                                <a th:href="@{/proveedores/editar/{id}(id=${p.id})}" class="btn btn-accion btn-primary" title="Editar">✏️</a>
                                <a th:href="@{/proveedores/eliminar/{id}(id=${p.id})}" class="btn btn-accion btn-danger" title="Eliminar" onclick="return confirm('¿Seguro?')">🗑️</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    function filtrar(texto) {
        const filas = document.querySelectorAll('.tabla-row');
        const t = texto.toLowerCase();
        filas.forEach(f => {
            f.style.display = f.textContent.toLowerCase().includes(t) ? '' : 'none';
        });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
