<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario Proveedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"
                        th:text="${proveedor.id} ?
                        'Editar Proveedor' : 'Nuevo Proveedor'">
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/proveedores/guardar}"
                          th:object="${proveedor}"
                          method="post">

                        <input type="hidden" th:field="*{id}"/>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre</label>
                            <input type="text" class="form-control"
                                   th:field="*{nombre}"
                                   placeholder="Ej: Laboratorios ABC"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">RUC</label>
                            <input type="text" class="form-control"
                                   th:field="*{ruc}"
                                   placeholder="Ej: 20512345678"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Teléfono</label>
                            <input type="text" class="form-control"
                                   th:field="*{telefono}"
                                   placeholder="Ej: 01-2345678"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Correo</label>
                            <input type="email" class="form-control"
                                   th:field="*{correo}"
                                   placeholder="Ej: ventas@abc.com"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Dirección</label>
                            <input type="text" class="form-control"
                                   th:field="*{direccion}"
                                   placeholder="Ej: Av. Lima 123"/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Contacto</label>
                            <input type="text" class="form-control"
                                   th:field="*{contacto}"
                                   placeholder="Ej: Carlos Ramos"/>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit"
                                    class="btn btn-success">
                                Guardar
                            </button>
                            <a href="/proveedores"
                               class="btn btn-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
