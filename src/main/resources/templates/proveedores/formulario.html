<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario Proveedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; transition: background 0.3s, color 0.3s; }
        .form-card { border-radius: 20px; border: none; box-shadow: 0 8px 32px rgba(0,0,0,0.10); overflow: hidden; }
        .form-header { background: linear-gradient(135deg, #1B5E20, #2E7D32); padding: 28px 32px; }
        .form-header h4 { color: white; font-weight: 800; margin: 0; font-size: 20px; }
        .form-header p { color: rgba(255,255,255,0.7); margin: 4px 0 0; font-size: 13px; }
        .form-body { padding: 32px; }
        .field-label { font-size: 13px; font-weight: 700; color: #424242; margin-bottom: 8px; display: block; }
        .field-label span { color: #e53935; }
        .input-wrapper { position: relative; }
        .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; color: #9e9e9e; }
        .form-input {
            width: 100%; padding: 12px 16px 12px 40px;
            border: 2px solid #e0e0e0; border-radius: 12px;
            font-size: 14px; transition: all 0.2s;
            background: #fafafa; color: #212121;
        }
        .form-input:focus {
            outline: none; border-color: #2E7D32;
            background: white; box-shadow: 0 0 0 4px rgba(46,125,50,0.08);
        }
        .field-hint { font-size: 11px; color: #9e9e9e; margin-top: 5px; }
        .section-divider { border: none; border-top: 1px solid #f0f0f0; margin: 24px 0; }
        .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #9e9e9e; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
        .btn-guardar {
            padding: 13px 32px; border-radius: 12px;
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            color: white; border: none; font-weight: 700;
            font-size: 14px; transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(46,125,50,0.3);
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-guardar:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(46,125,50,0.4); color: white; }
        .btn-cancelar {
            padding: 13px 24px; border-radius: 12px;
            background: #f5f5f5; color: #616161;
            border: none; font-weight: 600; font-size: 14px;
            transition: all 0.2s; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-cancelar:hover { background: #eeeeee; }

        /* ═══ MODO OSCURO ═══ */
        body.modo-oscuro { background: #121212; color: #e0e0e0; }
        body.modo-oscuro .form-card { background-color: #1e1e1e !important; }
        body.modo-oscuro .field-label { color: #c0c0c0 !important; }
        body.modo-oscuro .form-input { background-color: #2a2a2a !important; color: #e0e0e0 !important; border-color: #404040 !important; }
        body.modo-oscuro .field-hint { color: #888 !important; }
        body.modo-oscuro .section-divider { border-color: #2a2a2a !important; }
        body.modo-oscuro .btn-cancelar { background-color: #2a2a2a !important; color: #b0b0b0 !important; }
        body.modo-oscuro .btn-cancelar:hover { background-color: #353535 !important; }

        @media (max-width: 767.98px) {
            .form-header { padding: 22px 20px; }
            .form-body { padding: 20px; }
            .d-flex.gap-3.mt-4 { flex-direction: column; }
            .btn-guardar, .btn-cancelar { width: 100%; }
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="form-card">
                <div class="form-header">
                    <h4>
                        <i th:class="${proveedor.id} ? 'bi bi-pencil-fill me-1' : 'bi bi-truck me-1'"></i>
                        <span th:text="${proveedor.id} ? 'Editar Proveedor' : 'Nuevo Proveedor'"></span>
                    </h4>
                    <p th:text="${proveedor.id} ? 'Modifica los datos del proveedor' : 'Registra un nuevo proveedor de medicamentos'"></p>
                </div>
                <div class="form-body">
                    <form th:action="@{/proveedores/guardar}" th:object="${proveedor}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" th:field="*{id}"/>

                        <!-- Datos empresa -->
                        <p class="section-title"><i class="bi bi-building"></i>Datos de la empresa</p>

                        <div class="mb-4">
                            <label class="field-label">Nombre de la empresa <span>*</span></label>
                            <div class="input-wrapper">
                                <i class="bi bi-building input-icon"></i>
                                <input type="text" class="form-input" th:field="*{nombre}"
                                       placeholder="Ej: Laboratorios Genfar S.A." required/>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="field-label">RUC <span>*</span></label>
                            <div class="input-wrapper">
                                <i class="bi bi-hash input-icon"></i>
                                <input type="text" class="form-input" th:field="*{ruc}"
                                       placeholder="Ej: 20512345678" maxlength="11"
                                       oninput="this.value=this.value.replace(/[^0-9]/g,'')" required/>
                            </div>
                            <div class="field-hint">11 dígitos sin espacios</div>
                        </div>

                        <hr class="section-divider"/>

                        <!-- Contacto -->
                        <p class="section-title"><i class="bi bi-telephone"></i>Información de contacto</p>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="field-label">Teléfono</label>
                                <div class="input-wrapper">
                                    <i class="bi bi-telephone-fill input-icon"></i>
                                    <input type="text" class="form-input" th:field="*{telefono}"
                                           placeholder="Ej: 01-2345678"/>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="field-label">Correo electrónico</label>
                                <div class="input-wrapper">
                                    <i class="bi bi-envelope-fill input-icon"></i>
                                    <input type="email" class="form-input" th:field="*{correo}"
                                           placeholder="Ej: ventas@empresa.com"/>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="field-label">Dirección</label>
                            <div class="input-wrapper">
                                <i class="bi bi-geo-alt-fill input-icon"></i>
                                <input type="text" class="form-input" th:field="*{direccion}"
                                       placeholder="Ej: Av. Lima 123, Lima"/>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="field-label">Persona de contacto</label>
                            <div class="input-wrapper">
                                <i class="bi bi-person-fill input-icon"></i>
                                <input type="text" class="form-input" th:field="*{contacto}"
                                       placeholder="Ej: Carlos Ramos"/>
                            </div>
                            <div class="field-hint">Nombre del representante o vendedor</div>
                        </div>

                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn-guardar"><i class="bi bi-check-lg"></i>Guardar Proveedor</button>
                            <a href="/proveedores" class="btn-cancelar"><i class="bi bi-arrow-left"></i>Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    if (localStorage.getItem('tema') === 'oscuro') { document.body.classList.add('modo-oscuro'); }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
