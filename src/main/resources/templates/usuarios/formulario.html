<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; transition: background 0.3s, color 0.3s; }
        .form-card { border-radius: 20px; border: none; box-shadow: 0 8px 32px rgba(0,0,0,0.10); overflow: hidden; }
        .form-header { background: linear-gradient(135deg, #1B5E20, #2E7D32); padding: 28px 32px; }
        .form-header h4 { color: white; font-weight: 800; margin: 0; font-size: 20px; }
        .form-header p { color: rgba(255,255,255,0.7); margin: 4px 0 0; font-size: 13px; }
        .form-body { padding: 32px; }
        .field-label { font-size: 13px; font-weight: 700; color: #424242; margin-bottom: 8px; display: block; }
        .field-label span { color: #e53935; }
        .form-input {
            width: 100%; padding: 12px 16px;
            border: 2px solid #e0e0e0; border-radius: 12px;
            font-size: 14px; transition: all 0.2s;
            background: #fafafa; color: #212121;
        }
        .form-input:focus {
            outline: none; border-color: #2E7D32;
            background: white; box-shadow: 0 0 0 4px rgba(46,125,50,0.08);
        }
        .field-hint { font-size: 11px; color: #9e9e9e; margin-top: 5px; }
        .btn-guardar {
            padding: 13px 32px; border-radius: 12px;
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            color: white; border: none; font-weight: 700;
            font-size: 14px; transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(46,125,50,0.3);
        }
        .btn-guardar:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(46,125,50,0.4); }
        .btn-cancelar {
            padding: 13px 24px; border-radius: 12px;
            background: #f5f5f5; color: #616161;
            border: none; font-weight: 600; font-size: 14px;
            transition: all 0.2s; text-decoration: none;
            display: inline-flex; align-items: center;
        }
        .btn-cancelar:hover { background: #eeeeee; }
        .error-box {
            background: #fce4ec; border: 1px solid #f48fb1;
            color: #c62828; padding: 12px 16px; border-radius: 10px;
            margin-bottom: 20px; font-size: 13px;
            display: flex; align-items: center; gap: 8px;
        }
        .rol-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .rol-option { display: none; }
        .rol-label {
            display: flex; flex-direction: column; align-items: center;
            padding: 14px 8px; border: 2px solid #e0e0e0;
            border-radius: 10px; cursor: pointer; transition: all 0.2s;
            font-size: 12px; font-weight: 600; color: #616161;
            text-align: center; background: #fafafa;
        }
        .rol-label:hover { border-color: #2E7D32; background: #f1f8e9; }
        .rol-option:checked + .rol-label { border-color: #2E7D32; background: #e8f5e9; color: #1B5E20; }
        .rol-emoji { font-size: 22px; margin-bottom: 6px; }
        .pass-wrapper { position: relative; }
        .show-pass {
            position: absolute; right: 12px; top: 50%;
            transform: translateY(-50%); background: none;
            border: none; cursor: pointer; font-size: 16px; color: #9e9e9e;
        }

        /* ═══ MODO OSCURO ═══ */
        body.modo-oscuro { background: #121212; color: #e0e0e0; }
        body.modo-oscuro .form-card { background-color: #1e1e1e !important; }
        body.modo-oscuro .field-label { color: #c0c0c0 !important; }
        body.modo-oscuro .form-input { background-color: #2a2a2a !important; color: #e0e0e0 !important; border-color: #404040 !important; }
        body.modo-oscuro .field-hint { color: #888 !important; }
        body.modo-oscuro .rol-label { background-color: #2a2a2a !important; border-color: #404040 !important; color: #b0b0b0 !important; }
        body.modo-oscuro .rol-option:checked + .rol-label { background-color: #1b3320 !important; border-color: #2E7D32 !important; color: #81C784 !important; }
        body.modo-oscuro .btn-cancelar { background-color: #2a2a2a !important; color: #b0b0b0 !important; }
        body.modo-oscuro .btn-cancelar:hover { background-color: #353535 !important; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="form-card">
                <div class="form-header">
                    <h4 th:text="${usuario.id} ? '✏️ Editar Usuario' : '👤 Nuevo Usuario'"></h4>
                    <p th:text="${usuario.id} ? 'Modifica los datos del usuario' : 'Completa los datos para crear un nuevo acceso'"></p>
                </div>
                <div class="form-body">

                    <div class="error-box" th:if="${error}">
                        <span>❌</span><span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                        <input type="hidden" th:field="*{id}"/>

                        <!-- Nombre -->
                        <div class="mb-4">
                            <label class="field-label">Nombre completo <span>*</span></label>
                            <input type="text" class="form-input" th:field="*{nombre}"
                                   placeholder="Ej: María López" required/>
                        </div>

                        <!-- Username -->
                        <div class="mb-4">
                            <label class="field-label">Nombre de usuario <span>*</span></label>
                            <input type="text" class="form-input" th:field="*{username}"
                                   placeholder="Ej: mlopez" required/>
                            <div class="field-hint">🔑 Con este nombre ingresará al sistema</div>
                        </div>

                        <!-- Password solo en nuevo -->
                        <div class="mb-4" th:if="${usuario.id == null}">
                            <label class="field-label">Contraseña <span>*</span></label>
                            <div class="pass-wrapper">
                                <input type="password" id="password" class="form-input"
                                       th:field="*{password}"
                                       placeholder="Mínimo 6 caracteres" required
                                       style="padding-right:44px"/>
                                <button type="button" class="show-pass" onclick="togglePass()">👁️</button>
                            </div>
                            <div class="field-hint">Mínimo 6 caracteres</div>
                        </div>

                        <!-- Rol -->
                        <div class="mb-4">
                            <label class="field-label">Rol <span>*</span></label>
                            <div class="rol-grid">
                                <div>
                                    <input type="radio" name="rol" id="rol1" value="ADMIN" class="rol-option"
                                           th:checked="${usuario.rol == 'ADMIN'}"/>
                                    <label for="rol1" class="rol-label">
                                        <span class="rol-emoji">👑</span>
                                        Admin
                                        <span style="font-size:10px;color:#9e9e9e;font-weight:400">Acceso total</span>
                                    </label>
                                </div>
                                <div>
                                    <input type="radio" name="rol" id="rol2" value="CAJERO" class="rol-option"
                                           th:checked="${usuario.rol == 'CAJERO'}"/>
                                    <label for="rol2" class="rol-label">
                                        <span class="rol-emoji">🛒</span>
                                        Cajero
                                        <span style="font-size:10px;color:#9e9e9e;font-weight:400">Ventas</span>
                                    </label>
                                </div>
                                <div>
                                    <input type="radio" name="rol" id="rol3" value="ALMACENERO" class="rol-option"
                                           th:checked="${usuario.rol == 'ALMACENERO'}"/>
                                    <label for="rol3" class="rol-label">
                                        <span class="rol-emoji">📦</span>
                                        Almacenero
                                        <span style="font-size:10px;color:#9e9e9e;font-weight:400">Inventario</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn-guardar">✅ Guardar Usuario</button>
                            <a href="/usuarios" class="btn-cancelar">← Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePass() {
        const input = document.getElementById('password');
        const btn = document.querySelector('.show-pass');
        input.type = input.type === 'password' ? 'text' : 'password';
        btn.textContent = input.type === 'password' ? '👁️' : '🙈';
    }
    if (localStorage.getItem('tema') === 'oscuro') { document.body.classList.add('modo-oscuro'); }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
