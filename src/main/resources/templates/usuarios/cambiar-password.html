<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">🔑 Cambiar Contraseña</h5>
                </div>
                <div class="card-body p-4">

                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}"></div>

                    <form action="/usuarios/cambiar-password" method="post">

                        <input type="hidden" name="id"
                               th:value="${usuario.id}"/>

                        <!-- Usuario -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Usuario</label>
                            <input type="text" class="form-control"
                                   th:value="${usuario.nombre}"
                                   readonly/>
                        </div>

                        <!-- Contraseña actual -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Contraseña actual</label>
                            <div class="input-group">
                                <input type="password"
                                       name="passwordActual"
                                       id="passwordActual"
                                       class="form-control"
                                       placeholder="Ingresa la contraseña actual"
                                       required/>
                                <button type="button"
                                        class="btn btn-outline-secondary"
                                        onclick="togglePassword('passwordActual', this)">
                                    👁️
                                </button>
                            </div>
                        </div>

                        <!-- Contraseña nueva -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nueva contraseña</label>
                            <div class="input-group">
                                <input type="password"
                                       name="passwordNueva"
                                       id="passwordNueva"
                                       class="form-control"
                                       placeholder="Mínimo 6 caracteres"
                                       required/>
                                <button type="button"
                                        class="btn btn-outline-secondary"
                                        onclick="togglePassword('passwordNueva', this)">
                                    👁️
                                </button>
                            </div>
                        </div>

                        <!-- Confirmar contraseña -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Confirmar nueva contraseña</label>
                            <div class="input-group">
                                <input type="password"
                                       name="passwordConfirmar"
                                       id="passwordConfirmar"
                                       class="form-control"
                                       placeholder="Repite la nueva contraseña"
                                       required/>
                                <button type="button"
                                        class="btn btn-outline-secondary"
                                        onclick="togglePassword('passwordConfirmar', this)">
                                    👁️
                                </button>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                🔑 Cambiar Contraseña
                            </button>
                            <a href="/usuarios" class="btn btn-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🙈';
        } else {
            input.type = 'password';
            btn.textContent = '👁️';
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
