<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container-fluid py-4 px-3">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        ✅ <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-success mb-0">👥 Usuarios</h2>
        <a href="/usuarios/nuevo" class="btn btn-success btn-sm">+ Nuevo</a>
    </div>
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-success">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Username</th>
                        <th>Rol</th>
                        <th>Activo</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}"></td>
                        <td th:text="${u.nombre}"></td>
                        <td th:text="${u.username}"></td>
                        <td>
                            <span th:text="${u.rol}"
                                  th:class="${u.rol == 'ADMIN'} ? 'badge bg-danger' :
                                  (${u.rol == 'CAJERO'} ? 'badge bg-primary' : 'badge bg-warning text-dark')"
                                  style="font-size:12px;"></span>
                        </td>
                        <td>
                            <span th:if="${u.activo}" class="badge bg-success">Sí</span>
                            <span th:unless="${u.activo}" class="badge bg-danger">No</span>
                        </td>
                        <td>
                            <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-primary btn-sm me-1">✏️</a>
                            <a th:href="@{/usuarios/cambiar-password/{id}(id=${u.id})}" class="btn btn-warning btn-sm me-1">🔑</a>
                            <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Seguro?')">🗑️</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
