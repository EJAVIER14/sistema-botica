<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark" style="background-color: #2E7D32;">
    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold" href="/">
            💊 Sistema Botica
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">

                <!-- TODOS -->
                <li class="nav-item">
                    <a class="nav-link" href="/productos">📦 Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/alertas">🔔 Alertas</a>
                </li>

                <!-- ADMIN y CAJERO -->
                <li class="nav-item"
                    sec:authorize="hasAnyRole('ADMIN', 'CAJERO')">
                    <a class="nav-link" href="/ventas">🛒 Ventas</a>
                </li>

                <!-- ADMIN y ALMACENERO -->
                <li class="nav-item"
                    sec:authorize="hasAnyRole('ADMIN', 'ALMACENERO')">
                    <a class="nav-link" href="/proveedores">🚚 Proveedores</a>
                </li>

                <!-- Solo ADMIN -->
                <li class="nav-item"
                    sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/usuarios">👥 Usuarios</a>
                </li>
                <li class="nav-item"
                    sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/reportes">📊 Reportes</a>
                </li>

            </ul>

            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    🚪 Cerrar sesión
                </button>
            </form>
        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
