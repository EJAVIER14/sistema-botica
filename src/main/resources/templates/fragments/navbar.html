<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark" style="background-color: #2E7D32;">
    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold" href="/">
            💊 Sistema Botica
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/productos">📦 Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/alertas">🔔 Alertas</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'CAJERO')">
                    <a class="nav-link" href="/ventas">🛒 Ventas</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','ALMACENERO')">
                    <a class="nav-link" href="/proveedores">🚚 Proveedores</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/usuarios">👥 Usuarios</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/reportes">📊 Reportes</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/inventario">📋 Inventario</a>
                </li>

            </ul>

            <form th:action="@{/logout}" method="post" class="d-flex mt-2 mt-lg-0">
                <button type="submit" class="btn btn-outline-light btn-sm w-100">
                    🚪 Cerrar sesión
                </button>
            </form>
        </div>
    </div>
</nav>

<script>
    // Activar navbar manualmente sin depender de Bootstrap JS externo
    document.addEventListener('DOMContentLoaded', function() {
        const toggler = document.querySelector('.navbar-toggler');
        const navbarNav = document.getElementById('navbarNav');

        if (toggler && navbarNav) {
            toggler.addEventListener('click', function() {
                if (navbarNav.classList.contains('show')) {
                    navbarNav.classList.remove('show');
                } else {
                    navbarNav.classList.add('show');
                }
            });
        }
    });
</script>
</body>
</html>
