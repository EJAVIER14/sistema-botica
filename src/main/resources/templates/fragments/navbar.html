<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark botica-navbar" style="background-color: #2E7D32;">
    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold" href="/">
            💊 Sistema Botica
        </a>

        <!-- Botón hamburguesa personalizado -->
        <button class="navbar-toggler botica-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="botica-toggler-icon">
                <span></span>
                <span></span>
                <span></span>
            </span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/productos">📦 Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link position-relative" href="/alertas">
                        🔔 Alertas
                        <span th:if="${totalAlertasNavbar != null and totalAlertasNavbar > 0}"
                              class="badge rounded-pill bg-danger ms-1"
                              style="font-size:10px; vertical-align:top;"
                              th:text="${totalAlertasNavbar}">
                        </span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'CAJERO')">
                    <a class="nav-link" href="/ventas">🛒 Ventas</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','ALMACENERO')">
                    <a class="nav-link" href="/proveedores">🚚 Proveedores</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/usuarios">👥 Usuarios</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/reportes">📊 Reportes</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/inventario">📋 Inventario</a>
                </li>

            </ul>

            <hr class="d-lg-none navbar-divider">

            <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0 botica-navbar-actions">
                <button type="button" id="btn-modo-oscuro"
                        class="btn btn-outline-light btn-sm"
                        title="Cambiar tema" onclick="toggleModoOscuro()">
                    <span id="icono-modo">🌙</span>
                </button>
                <a href="/perfil" class="btn btn-outline-light btn-sm">
                    👤 Mi Perfil
                </a>
                <form th:action="@{/logout}" method="post" class="d-flex">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        🚪 Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </div>

    <style>
        /* ═══ Botón hamburguesa personalizado ═══ */
        .botica-toggler {
            border: none !important;
            box-shadow: none !important;
            padding: 8px !important;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12) !important;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }
        .botica-toggler:hover {
            background: rgba(255, 255, 255, 0.2) !important;
        }
        .botica-toggler:active {
            transform: scale(0.94);
        }
        .botica-toggler:focus {
            box-shadow: none !important;
        }

        /* Anulamos el ícono default de Bootstrap */
        .botica-toggler .navbar-toggler-icon,
        .botica-toggler-icon {
            background-image: none !important;
        }

        .botica-toggler-icon {
            position: relative;
            width: 20px;
            height: 16px;
            display: inline-block;
        }
        .botica-toggler-icon span {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            border-radius: 2px;
            background: #ffffff;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
            opacity 0.2s ease,
            top 0.3s ease;
        }
        .botica-toggler-icon span:nth-child(1) { top: 0; }
        .botica-toggler-icon span:nth-child(2) { top: 7px; }
        .botica-toggler-icon span:nth-child(3) { top: 14px; }

        /* Estado abierto: se transforma en una X */
        .botica-toggler[aria-expanded="true"] .botica-toggler-icon span:nth-child(1) {
            top: 7px;
            transform: rotate(45deg);
        }
        .botica-toggler[aria-expanded="true"] .botica-toggler-icon span:nth-child(2) {
            opacity: 0;
        }
        .botica-toggler[aria-expanded="true"] .botica-toggler-icon span:nth-child(3) {
            top: 7px;
            transform: rotate(-45deg);
        }

        /* ═══ Mejora visual del menú en móvil ═══ */
        @media (max-width: 991.98px) {
            .botica-navbar .navbar-collapse {
                padding-top: 8px;
                padding-bottom: 12px;
            }

            .botica-navbar .navbar-nav .nav-item {
                border-radius: 8px;
                margin-bottom: 4px;
                transition: background-color 0.15s ease;
            }

            .botica-navbar .navbar-nav .nav-link {
                padding: 10px 14px;
                border-radius: 8px;
                font-weight: 500;
            }

            .botica-navbar .navbar-nav .nav-item:active,
            .botica-navbar .navbar-nav .nav-link:active {
                background-color: rgba(255, 255, 255, 0.15);
            }

            .botica-navbar .navbar-divider {
                border-color: rgba(255, 255, 255, 0.25);
                margin: 8px 0 12px 0;
            }

            .botica-navbar-actions {
                flex-wrap: wrap;
                gap: 8px !important;
            }

            .botica-navbar-actions .btn,
            .botica-navbar-actions form {
                flex: 1 1 auto;
            }

            .botica-navbar-actions .btn {
                width: 100%;
            }
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const navbarNav = document.getElementById('navbarNav');
            const toggler = document.querySelector('.botica-toggler');

            // Sincroniza el ícono (líneas → X) cuando Bootstrap abre/cierra el collapse
            if (navbarNav && toggler) {
                navbarNav.addEventListener('shown.bs.collapse', function() {
                    toggler.setAttribute('aria-expanded', 'true');
                });
                navbarNav.addEventListener('hidden.bs.collapse', function() {
                    toggler.setAttribute('aria-expanded', 'false');
                });
            }

            // Cerrar el menú automáticamente al tocar un link
            if (navbarNav) {
                const links = navbarNav.querySelectorAll('.nav-link, .btn, form button[type="submit"]');
                links.forEach(function(link) {
                    link.addEventListener('click', function() {
                        if (navbarNav.classList.contains('show') && window.innerWidth < 992) {
                            const bsCollapse = bootstrap.Collapse.getOrCreateInstance(navbarNav);
                            bsCollapse.hide();
                        }
                    });
                });
            }

            const temaGuardado = localStorage.getItem('tema') || 'claro';
            if (temaGuardado === 'oscuro') {
                document.body.classList.add('modo-oscuro');
                document.getElementById('icono-modo').textContent = '☀️';
            }
        });

        function toggleModoOscuro() {
            const body = document.body;
            const icono = document.getElementById('icono-modo');

            body.classList.toggle('modo-oscuro');

            if (body.classList.contains('modo-oscuro')) {
                localStorage.setItem('tema', 'oscuro');
                icono.textContent = '☀️';
            } else {
                localStorage.setItem('tema', 'claro');
                icono.textContent = '🌙';
            }
        }
    </script>
</nav>
</body>
</html>
