<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark botica-navbar" style="background-color: #2E7D32;">
    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold" href="/">
            💊 Sistema Botica
        </a>

        <!-- Botón hamburguesa -->
        <button class="navbar-toggler botica-toggler" type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#navbarOffcanvas"
                aria-controls="navbarOffcanvas"
                aria-label="Toggle navigation">
            <span class="botica-toggler-icon">
                <span></span><span></span><span></span>
            </span>
        </button>

        <!-- Panel responsive: offcanvas en móvil, barra normal en desktop (lg+) -->
        <div class="offcanvas-lg offcanvas-end botica-offcanvas" tabindex="-1" id="navbarOffcanvas">

            <!-- Header del panel (solo visible en móvil) -->
            <div class="offcanvas-header botica-offcanvas-header d-lg-none">
                <div class="d-flex align-items-center gap-2">
                    <div class="botica-avatar"
                         th:text="${#authentication != null and #authentication.name != null and #authentication.name.length() > 0 ? #authentication.name.substring(0,1).toUpperCase() : '?'}">
                    </div>
                    <div>
                        <div class="botica-user-name" th:text="${#authentication != null ? #authentication.name : 'Usuario'}"></div>
                        <div class="botica-user-role">Mi cuenta</div>
                    </div>
                </div>
                <button type="button" class="btn-close botica-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>

            <div class="offcanvas-body botica-offcanvas-body">

                <ul class="navbar-nav botica-menu-list me-auto">

                    <li class="nav-item">
                        <a class="nav-link botica-menu-item" href="/productos">
                            <span class="bmi-icon">📦</span>
                            <span class="bmi-label">Productos</span>
                            <i class="bmi-chevron bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link botica-menu-item position-relative" href="/alertas">
                            <span class="bmi-icon">🔔</span>
                            <span class="bmi-label">Alertas</span>
                            <span th:if="${totalAlertasNavbar != null and totalAlertasNavbar > 0}"
                                  class="badge rounded-pill bg-danger bmi-badge"
                                  th:text="${totalAlertasNavbar}">
                            </span>
                            <i class="bmi-chevron bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'CAJERO')">
                        <a class="nav-link botica-menu-item" href="/ventas">
                            <span class="bmi-icon">🛒</span>
                            <span class="bmi-label">Ventas</span>
                            <i class="bmi-chevron bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','ALMACENERO')">
                        <a class="nav-link botica-menu-item" href="/proveedores">
                            <span class="bmi-icon">🚚</span>
                            <span class="bmi-label">Proveedores</span>
                            <i class="bmi-chevron bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link botica-menu-item" href="/usuarios">
                            <span class="bmi-icon">👥</span>
                            <span class="bmi-label">Usuarios</span>
                            <i class="bmi-chevron bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link botica-menu-item" href="/reportes">
                            <span class="bmi-icon">📊</span>
                            <span class="bmi-label">Reportes</span>
                            <i class="bmi-chevron bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link botica-menu-item" href="/inventario">
                            <span class="bmi-icon">📋</span>
                            <span class="bmi-label">Inventario</span>
                            <i class="bmi-chevron bi bi-chevron-right"></i>
                        </a>
                    </li>

                </ul>

                <!-- Acciones (Tema / Perfil / Cerrar sesión) -->
                <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0 botica-navbar-actions">
                    <button type="button" id="btn-modo-oscuro"
                            class="btn btn-outline-light btn-sm botica-menu-item botica-action-item"
                            title="Cambiar tema" onclick="toggleModoOscuro()">
                        <span class="bmi-icon" id="icono-modo">🌙</span>
                        <span class="bmi-label d-lg-none">Modo oscuro</span>
                    </button>
                    <a href="/perfil" class="btn btn-outline-light btn-sm botica-menu-item botica-action-item">
                        <span class="bmi-icon">👤</span>
                        <span class="bmi-label d-lg-none">Mi Perfil</span>
                        <span class="d-none d-lg-inline">Mi Perfil</span>
                        <i class="bmi-chevron d-lg-none bi bi-chevron-right"></i>
                    </a>
                    <form th:action="@{/logout}" method="post" class="d-flex botica-logout-form">
                        <button type="submit" class="btn btn-outline-light btn-sm botica-menu-item botica-action-item botica-logout">
                            <span class="bmi-icon">🚪</span>
                            <span class="bmi-label d-lg-none">Cerrar sesión</span>
                            <span class="d-none d-lg-inline">Cerrar sesión</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* ═══ Botón hamburguesa ═══ */
        .botica-toggler {
            border: none !important;
            box-shadow: none !important;
            padding: 8px !important;
            width: 42px; height: 42px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12) !important;
            display: flex; align-items: center; justify-content: center;
            transition: background-color 0.2s ease;
        }
        .botica-toggler:hover { background: rgba(255, 255, 255, 0.2) !important; }
        .botica-toggler:active { transform: scale(0.94); }
        .botica-toggler:focus { box-shadow: none !important; }
        .botica-toggler .navbar-toggler-icon { background-image: none !important; }

        .botica-toggler-icon { position: relative; width: 20px; height: 16px; display: inline-block; }
        .botica-toggler-icon span {
            position: absolute; left: 0; width: 100%; height: 2px;
            border-radius: 2px; background: #ffffff;
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.2s ease, top 0.3s ease;
        }
        .botica-toggler-icon span:nth-child(1) { top: 0; }
        .botica-toggler-icon span:nth-child(2) { top: 7px; }
        .botica-toggler-icon span:nth-child(3) { top: 14px; }
        .botica-toggler[aria-expanded="true"] .botica-toggler-icon span:nth-child(1) { top: 7px; transform: rotate(45deg); }
        .botica-toggler[aria-expanded="true"] .botica-toggler-icon span:nth-child(2) { opacity: 0; }
        .botica-toggler[aria-expanded="true"] .botica-toggler-icon span:nth-child(3) { top: 7px; transform: rotate(-45deg); }

        /* ═══════════════════ MÓVIL: panel tipo drawer ═══════════════════ */
        @media (max-width: 991.98px) {
            .botica-offcanvas {
                width: 85%;
                max-width: 340px;
                background: #ffffff;
                color: #212121;
            }

            .botica-offcanvas-header {
                background: linear-gradient(135deg, #1B5E20, #2E7D32);
                padding: 20px;
                align-items: center;
            }
            .botica-avatar {
                width: 42px; height: 42px; border-radius: 50%;
                background: rgba(255,255,255,0.2);
                border: 2px solid rgba(255,255,255,0.4);
                display: flex; align-items: center; justify-content: center;
                color: white; font-weight: 800; font-size: 16px; flex-shrink: 0;
            }
            .botica-user-name { color: white; font-weight: 700; font-size: 14px; text-transform: capitalize; }
            .botica-user-role { color: rgba(255,255,255,0.75); font-size: 11px; }
            .botica-close {
                filter: invert(1) grayscale(100%) brightness(200%);
                opacity: 0.9;
            }

            .botica-offcanvas-body {
                padding: 8px 0 0;
                display: flex;
                flex-direction: column;
            }

            .botica-menu-list { display: flex; flex-direction: column; }

            .botica-menu-item {
                display: flex !important;
                align-items: center;
                gap: 14px;
                padding: 14px 20px !important;
                color: #333 !important;
                font-weight: 600;
                font-size: 14.5px;
                border-bottom: 1px solid #f0f0f0;
                border-radius: 0 !important;
                background: transparent !important;
                border-left: none; border-right: none; border-top: none;
                width: 100%;
                text-align: left;
            }
            .botica-menu-item:active { background: #f5f5f5 !important; }

            .bmi-icon { font-size: 18px; width: 22px; text-align: center; flex-shrink: 0; }
            .bmi-label { flex: 1; }
            .bmi-chevron { color: #c0c0c0; font-size: 13px; }
            .bmi-badge { position: static; margin-left: -6px; }

            .botica-navbar-actions {
                flex-direction: column;
                align-items: stretch !important;
                gap: 0 !important;
                margin-top: 8px;
                border-top: 6px solid #f5f5f5;
            }
            .botica-action-item {
                border: none !important;
                justify-content: flex-start;
            }
            .botica-logout-form { width: 100%; }
            .botica-logout { color: #c62828 !important; }
            .botica-logout .bmi-icon { filter: none; }
        }

        /* ═══════════════════ DESKTOP: navbar horizontal normal ═══════════════════ */
        @media (min-width: 992px) {
            .botica-menu-item { display: flex !important; align-items: center; gap: 6px; }
            .bmi-chevron { display: none; }
            .bmi-badge { margin-left: 4px; }
            .botica-action-item .bmi-label { display: none; }
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const offcanvasEl = document.getElementById('navbarOffcanvas');
            const toggler = document.querySelector('.botica-toggler');

            if (offcanvasEl && toggler) {
                offcanvasEl.addEventListener('shown.bs.offcanvas', function() {
                    toggler.setAttribute('aria-expanded', 'true');
                });
                offcanvasEl.addEventListener('hidden.bs.offcanvas', function() {
                    toggler.setAttribute('aria-expanded', 'false');
                });

                // Cerrar el panel automáticamente al tocar un link u opción
                const links = offcanvasEl.querySelectorAll('.nav-link, .btn, form button[type="submit"]');
                links.forEach(function(link) {
                    link.addEventListener('click', function() {
                        if (window.innerWidth < 992) {
                            const instance = bootstrap.Offcanvas.getOrCreateInstance(offcanvasEl);
                            instance.hide();
                        }
                    });
                });
            }

            const temaGuardado = localStorage.getItem('tema') || 'claro';
            if (temaGuardado === 'oscuro') {
                document.body.classList.add('modo-oscuro');
                document.getElementById('icono-modo').textContent = '☀️';
            }
        });

        function toggleModoOscuro() {
            const body = document.body;
            const icono = document.getElementById('icono-modo');

            body.classList.toggle('modo-oscuro');

            if (body.classList.contains('modo-oscuro')) {
                localStorage.setItem('tema', 'oscuro');
                icono.textContent = '☀️';
            } else {
                localStorage.setItem('tema', 'claro');
                icono.textContent = '🌙';
            }
        }
    </script>
</nav>
</body>
</html>
