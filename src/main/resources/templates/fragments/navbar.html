<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark botica-navbar" style="background-color: #2E7D32;">
    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold" href="/">
            💊 Sistema Botica
        </a>

        <!-- Botón hamburguesa -->
        <button class="navbar-toggler botica-toggler" type="button" id="botica-toggler-btn"
                aria-controls="boticaDrawer" aria-expanded="false" aria-label="Toggle navigation">
            <span class="botica-toggler-icon">
                <span></span><span></span><span></span>
            </span>
        </button>

        <!-- Fondo oscuro (solo visible cuando el panel está abierto en móvil) -->
        <div class="botica-backdrop" id="boticaBackdrop"></div>

        <!-- Panel: drawer en móvil, barra normal en desktop -->
        <div class="botica-drawer" id="boticaDrawer">

            <!-- Header del panel (solo visible en móvil) -->
            <div class="botica-drawer-header d-lg-none">
                <div class="d-flex align-items-center gap-2">
                    <div class="botica-avatar"
                         th:text="${#authentication != null and #authentication.name != null and #authentication.name.length() > 0 ? #authentication.name.substring(0,1).toUpperCase() : '?'}">
                    </div>
                    <div>
                        <div class="botica-user-name" th:text="${#authentication != null ? #authentication.name : 'Usuario'}"></div>
                        <div class="botica-user-role">Mi cuenta</div>
                    </div>
                </div>
                <button type="button" class="botica-close" id="boticaCloseBtn" aria-label="Cerrar">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <div class="botica-drawer-body">

                <ul class="navbar-nav botica-menu-list me-auto">
                    <li class="nav-item">
                        <a class="nav-link botica-menu-item" href="/productos">
                            <span class="bmi-icon">📦</span>
                            <span class="bmi-label">Productos</span>
                            <i class="bmi-chevron bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link botica-menu-item position-relative" href="/alertas">
                            <span class="bmi-icon">🔔</span>
                            <span class="bmi-label">Alertas</span>
                            <span th:if="${totalAlertasNavbar != null and totalAlertasNavbar > 0}"
                                  class="badge rounded-pill bg-danger bmi-badge"
                                  th:text="${totalAlertasNavbar}">
                            </span>
                            <i class="bmi-chevron bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'CAJERO')">
                        <a class="nav-link botica-menu-item" href="/ventas">
                            <span class="bmi-icon">🛒</span>
                            <span class="bmi-label">Ventas</span>
                            <i class="bmi-chevron bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','ALMACENERO')">
                        <a class="nav-link botica-menu-item" href="/proveedores">
                            <span class="bmi-icon">🚚</span>
                            <span class="bmi-label">Proveedores</span>
                            <i class="bmi-chevron bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link botica-menu-item" href="/usuarios">
                            <span class="bmi-icon">👥</span>
                            <span class="bmi-label">Usuarios</span>
                            <i class="bmi-chevron bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link botica-menu-item" href="/reportes">
                            <span class="bmi-icon">📊</span>
                            <span class="bmi-label">Reportes</span>
                            <i class="bmi-chevron bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link botica-menu-item" href="/inventario">
                            <span class="bmi-icon">📋</span>
                            <span class="bmi-label">Inventario</span>
                            <i class="bmi-chevron bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link botica-menu-item" href="/auditoria">
                            <span class="bmi-icon">📜</span>
                            <span class="bmi-label">Auditoría</span>
                            <i class="bmi-chevron bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>

                <!-- Acciones -->
                <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0 botica-navbar-actions">
                    <button type="button" id="btn-modo-oscuro"
                            class="botica-menu-item botica-action-item botica-theme-btn"
                            title="Cambiar tema" onclick="toggleModoOscuro()">
                        <span class="bmi-icon" id="icono-modo">🌙</span>
                        <span class="bmi-label d-lg-none">Modo oscuro</span>
                    </button>

                    <span class="botica-action-divider d-none d-lg-block"></span>

                    <a href="/perfil" class="botica-menu-item botica-action-item botica-profile-btn">
                        <span class="botica-profile-avatar d-none d-lg-flex"
                              th:text="${#authentication != null and #authentication.name != null and #authentication.name.length() > 0 ? #authentication.name.substring(0,1).toUpperCase() : '?'}">
                        </span>
                        <span class="bmi-icon d-lg-none">👤</span>
                        <span class="bmi-label d-lg-none">Mi Perfil</span>
                        <span class="d-none d-lg-inline botica-profile-text" th:text="${#authentication != null ? #authentication.name : 'Mi Perfil'}">Mi Perfil</span>
                        <i class="bmi-chevron d-lg-none bi bi-chevron-right"></i>
                    </a>

                    <span class="botica-action-divider d-none d-lg-block"></span>

                    <form th:action="@{/logout}" method="post" class="d-flex botica-logout-form">
                        <button type="submit" class="botica-menu-item botica-action-item botica-logout">
                            <span class="bmi-icon">🚪</span>
                            <span class="bmi-label d-lg-none">Cerrar sesión</span>
                            <span class="d-none d-lg-inline">Salir</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══ CONTENEDOR DE TOASTS ═══ -->
    <div class="botica-toast-container" id="boticaToastContainer"></div>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* ═══ Botón hamburguesa ═══ */
        .botica-toggler {
            border: none !important; box-shadow: none !important; padding: 8px !important;
            width: 42px; height: 42px; border-radius: 10px;
            background: rgba(255,255,255,0.12) !important;
            display: flex; align-items: center; justify-content: center;
            transition: background-color 0.2s ease;
        }
        .botica-toggler:hover { background: rgba(255,255,255,0.2) !important; }
        .botica-toggler:active { transform: scale(0.94); }
        .botica-toggler-icon { position: relative; width: 20px; height: 16px; display: inline-block; }
        .botica-toggler-icon span {
            position: absolute; left: 0; width: 100%; height: 2px;
            border-radius: 2px; background: #ffffff;
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.2s ease, top 0.3s ease;
        }
        .botica-toggler-icon span:nth-child(1) { top: 0; }
        .botica-toggler-icon span:nth-child(2) { top: 7px; }
        .botica-toggler-icon span:nth-child(3) { top: 14px; }
        .botica-toggler[aria-expanded="true"] .botica-toggler-icon span:nth-child(1) { top: 7px; transform: rotate(45deg); }
        .botica-toggler[aria-expanded="true"] .botica-toggler-icon span:nth-child(2) { opacity: 0; }
        .botica-toggler[aria-expanded="true"] .botica-toggler-icon span:nth-child(3) { top: 7px; transform: rotate(-45deg); }

        /* ═══════════════════ MÓVIL: panel tipo drawer ═══════════════════ */
        @media (max-width: 991.98px) {
            .botica-backdrop {
                position: fixed; inset: 0;
                background: rgba(0,0,0,0.5);
                opacity: 0; visibility: hidden;
                transition: opacity 0.3s ease;
                z-index: 1040;
            }
            .botica-backdrop.show { opacity: 1; visibility: visible; }

            .botica-drawer {
                position: fixed; top: 0; right: 0;
                width: 85%; max-width: 340px; height: 100vh;
                background: #ffffff; color: #212121;
                transform: translateX(100%);
                transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
                z-index: 1045;
                display: flex; flex-direction: column;
                overflow-y: auto;
                box-shadow: -8px 0 30px rgba(0,0,0,0.2);
            }
            .botica-drawer.show { transform: translateX(0); }

            .botica-drawer-header {
                background: linear-gradient(135deg, #1B5E20, #2E7D32);
                padding: 20px;
                display: flex; align-items: center; justify-content: space-between;
                flex-shrink: 0;
            }
            .botica-avatar {
                width: 42px; height: 42px; border-radius: 50%;
                background: rgba(255,255,255,0.2);
                border: 2px solid rgba(255,255,255,0.4);
                display: flex; align-items: center; justify-content: center;
                color: white; font-weight: 800; font-size: 16px; flex-shrink: 0;
            }
            .botica-user-name { color: white; font-weight: 700; font-size: 14px; text-transform: capitalize; }
            .botica-user-role { color: rgba(255,255,255,0.75); font-size: 11px; }
            .botica-close {
                width: 36px; height: 36px; border-radius: 50%;
                background: rgba(255,255,255,0.15); border: none; color: white;
                display: flex; align-items: center; justify-content: center;
                font-size: 16px; flex-shrink: 0;
            }
            .botica-close:active { background: rgba(255,255,255,0.3); }

            .botica-drawer-body { padding: 8px 0 24px; display: flex; flex-direction: column; }
            .botica-menu-list { display: flex; flex-direction: column; }

            .botica-menu-item {
                display: flex !important; align-items: center; gap: 14px;
                padding: 14px 20px !important; color: #333 !important;
                font-weight: 600; font-size: 14.5px;
                border-bottom: 1px solid #f0f0f0;
                border-radius: 0 !important; background: transparent !important;
                border-left: none; border-right: none; border-top: none;
                width: 100%; text-align: left;
            }
            .botica-menu-item:active { background: #f5f5f5 !important; }

            .bmi-icon { font-size: 18px; width: 22px; text-align: center; flex-shrink: 0; }
            .bmi-label { flex: 1; }
            .bmi-chevron { color: #c0c0c0; font-size: 13px; }
            .bmi-badge { position: static; margin-left: -6px; }

            .botica-navbar-actions {
                flex-direction: column; align-items: stretch !important; gap: 0 !important;
                margin-top: 8px; border-top: 6px solid #f5f5f5;
            }
            .botica-action-item { border: none !important; justify-content: flex-start; }
            .botica-logout-form { width: 100%; }
            .botica-logout { color: #c62828 !important; }
        }

        /* ═══════════════════ DESKTOP: navbar horizontal normal ═══════════════════ */
        @media (min-width: 992px) {
            .botica-backdrop { display: none; }
            .botica-drawer {
                position: static; transform: none; width: auto; height: auto;
                background: transparent; box-shadow: none; overflow: visible;
                display: flex; flex-grow: 1; flex-basis: auto;
            }
            .botica-drawer-body {
                display: flex; flex-grow: 1; align-items: center;
                padding: 0; width: 100%;
            }
            .botica-menu-list { flex-direction: row; flex-grow: 1; }
            .botica-menu-item { display: flex !important; align-items: center; gap: 6px; padding: 8px 12px !important; }
            .bmi-chevron { display: none; }
            .bmi-badge { margin-left: 4px; }

            /* ═══ Botones de acción rediseñados (desktop) ═══ */
            .botica-navbar-actions { gap: 4px !important; }

            .botica-action-item {
                border: none !important;
                background: transparent !important;
                color: rgba(255,255,255,0.9) !important;
            }

            /* Toggle de tema: ícono circular */
            .botica-theme-btn {
                width: 38px; height: 38px;
                padding: 0 !important;
                border-radius: 50% !important;
                display: flex; align-items: center; justify-content: center;
                background: rgba(255,255,255,0.1) !important;
                transition: background-color 0.2s ease, transform 0.15s ease;
            }
            .botica-theme-btn:hover { background: rgba(255,255,255,0.2) !important; }
            .botica-theme-btn:active { transform: scale(0.92); }
            .botica-theme-btn .bmi-icon { width: auto; font-size: 15px; }

            /* Divisor sutil entre grupos de botones */
            .botica-action-divider {
                width: 1px; height: 22px;
                background: rgba(255,255,255,0.25);
                margin: 0 4px;
            }

            /* Botón de perfil: avatar + nombre */
            .botica-profile-btn {
                display: flex !important;
                align-items: center;
                gap: 8px;
                padding: 5px 14px 5px 6px !important;
                border-radius: 20px !important;
                background: rgba(255,255,255,0.1) !important;
                transition: background-color 0.2s ease;
                text-decoration: none;
            }
            .botica-profile-btn:hover { background: rgba(255,255,255,0.18) !important; }
            .botica-profile-avatar {
                width: 26px; height: 26px;
                border-radius: 50%;
                background: rgba(255,255,255,0.25);
                align-items: center; justify-content: center;
                font-size: 11px; font-weight: 800; color: white;
                flex-shrink: 0;
            }
            .botica-profile-text {
                font-size: 13px; font-weight: 600;
                text-transform: capitalize;
                max-width: 110px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            /* Botón de cerrar sesión: discreto, se resalta en rojo al pasar el mouse */
            .botica-logout {
                display: flex !important;
                align-items: center;
                gap: 6px;
                padding: 7px 14px !important;
                border-radius: 20px !important;
                font-size: 13px;
                font-weight: 600;
                color: rgba(255,255,255,0.75) !important;
                transition: all 0.2s ease;
            }
            .botica-logout:hover {
                background: rgba(198,40,40,0.15) !important;
                color: #ffcdd2 !important;
            }
            .botica-logout .bmi-icon { font-size: 14px; }
        }

        /* ═══ Sistema de Toasts ═══ */
        .botica-toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: calc(100% - 40px);
        }

        .botica-toast {
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            padding: 14px 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            border-left: 4px solid #2E7D32;
            transform: translateX(120%);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }
        .botica-toast.show { transform: translateX(0); opacity: 1; }
        .botica-toast.hide { transform: translateX(120%); opacity: 0; }

        .botica-toast.success { border-left-color: #2E7D32; }
        .botica-toast.error { border-left-color: #c62828; }
        .botica-toast.warning { border-left-color: #f57c00; }
        .botica-toast.info { border-left-color: #1565C0; }

        .botica-toast-icon {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }
        .botica-toast.success .botica-toast-icon { background: #e8f5e9; color: #2E7D32; }
        .botica-toast.error .botica-toast-icon { background: #fce4ec; color: #c62828; }
        .botica-toast.warning .botica-toast-icon { background: #fff8e1; color: #f57c00; }
        .botica-toast.info .botica-toast-icon { background: #e3f2fd; color: #1565C0; }

        .botica-toast-content { flex: 1; padding-top: 2px; }
        .botica-toast-title { font-weight: 700; font-size: 13.5px; color: #212121; margin-bottom: 2px; }
        .botica-toast-message { font-size: 12.5px; color: #757575; line-height: 1.4; }

        .botica-toast-close {
            background: none; border: none; color: #bdbdbd;
            font-size: 14px; cursor: pointer; padding: 2px;
            flex-shrink: 0; line-height: 1;
        }
        .botica-toast-close:hover { color: #757575; }

        .botica-toast-progress {
            position: absolute;
            bottom: 0; left: 0;
            height: 3px;
            background: rgba(0,0,0,0.08);
            border-radius: 0 0 14px 14px;
            animation: boticaToastProgress linear forwards;
        }
        @keyframes boticaToastProgress {
            from { width: 100%; }
            to { width: 0%; }
        }

        body.modo-oscuro .botica-toast { background-color: #262626 !important; }
        body.modo-oscuro .botica-toast-title { color: #f0f0f0 !important; }
        body.modo-oscuro .botica-toast-message { color: #b0b0b0 !important; }

        @media (max-width: 480px) {
            .botica-toast-container {
                top: 12px; right: 12px; left: 12px;
                max-width: 100%; width: auto;
            }
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const drawer = document.getElementById('boticaDrawer');
            const backdrop = document.getElementById('boticaBackdrop');
            const toggler = document.getElementById('botica-toggler-btn');
            const closeBtn = document.getElementById('boticaCloseBtn');

            function abrirMenu() {
                drawer.classList.add('show');
                backdrop.classList.add('show');
                toggler.setAttribute('aria-expanded', 'true');
                document.body.style.overflow = 'hidden';
            }
            function cerrarMenu() {
                drawer.classList.remove('show');
                backdrop.classList.remove('show');
                toggler.setAttribute('aria-expanded', 'false');
                document.body.style.overflow = '';
            }

            toggler.addEventListener('click', function() {
                drawer.classList.contains('show') ? cerrarMenu() : abrirMenu();
            });
            closeBtn.addEventListener('click', cerrarMenu);
            backdrop.addEventListener('click', cerrarMenu);

            const links = drawer.querySelectorAll('.nav-link, .btn, form button[type="submit"], .botica-action-item');
            links.forEach(function(link) {
                link.addEventListener('click', function() {
                    if (window.innerWidth < 992) cerrarMenu();
                });
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth >= 992) cerrarMenu();
            });

            const temaGuardado = localStorage.getItem('tema') || 'claro';
            if (temaGuardado === 'oscuro') {
                document.body.classList.add('modo-oscuro');
                document.getElementById('icono-modo').textContent = '☀️';
            }
        });

        function toggleModoOscuro() {
            const body = document.body;
            const icono = document.getElementById('icono-modo');
            body.classList.toggle('modo-oscuro');
            if (body.classList.contains('modo-oscuro')) {
                localStorage.setItem('tema', 'oscuro');
                icono.textContent = '☀️';
            } else {
                localStorage.setItem('tema', 'claro');
                icono.textContent = '🌙';
            }
        }

        /**
         * Muestra una notificación toast flotante.
         * @param {string} mensaje - Texto del mensaje
         * @param {string} tipo - 'success' | 'error' | 'warning' | 'info'
         * @param {string} titulo - Título opcional (por defecto según el tipo)
         */
        function mostrarToast(mensaje, tipo = 'success', titulo = null) {
            const container = document.getElementById('boticaToastContainer');
            if (!container) return;

            const iconos = {
                success: '<i class="bi bi-check-lg"></i>',
                error: '<i class="bi bi-x-lg"></i>',
                warning: '<i class="bi bi-exclamation-triangle-fill"></i>',
                info: '<i class="bi bi-info-lg"></i>'
            };
            const titulos = {
                success: titulo || 'Listo',
                error: titulo || 'Error',
                warning: titulo || 'Atención',
                info: titulo || 'Información'
            };

            const toast = document.createElement('div');
            toast.className = 'botica-toast ' + tipo;
            toast.style.position = 'relative';
            toast.innerHTML = `
                <div class="botica-toast-icon">${iconos[tipo] || iconos.success}</div>
                <div class="botica-toast-content">
                    <div class="botica-toast-title">${titulos[tipo] || titulos.success}</div>
                    <div class="botica-toast-message">${mensaje}</div>
                </div>
                <button type="button" class="botica-toast-close" aria-label="Cerrar">
                    <i class="bi bi-x"></i>
                </button>
                <div class="botica-toast-progress" style="animation-duration: 4s;"></div>
            `;

            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));

            function cerrarToast() {
                toast.classList.remove('show');
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 350);
            }

            toast.querySelector('.botica-toast-close').addEventListener('click', cerrarToast);
            setTimeout(cerrarToast, 4000);
        }
    </script>
</nav>
</body>
</html>
