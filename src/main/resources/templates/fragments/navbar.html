<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark" style="background-color: #2E7D32;">
    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold" href="/">
            💊 Sistema Botica
        </a>

        <!-- Botón móvil -->
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">

                <!-- TODOS -->
                <li class="nav-item">
                    <a class="nav-link" href="/productos">📦 Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/alertas">🔔 Alertas</a>
                </li>

                <!-- ADMIN y CAJERO -->
                <li class="nav-item"
                    sec:authorize="hasAnyRole('ADMIN', 'CAJERO')">
                    <a class="nav-link" href="/ventas">🛒 Ventas</a>
                </li>

                <!-- ADMIN y ALMACENERO -->
                <li class="nav-item"
                    sec:authorize="hasAnyRole('ADMIN','ALMACENERO')">
                    <a class="nav-link" href="/proveedores">🚚 Proveedores</a>
                </li>

                <!-- Solo ADMIN -->
                <li class="nav-item"
                    sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/usuarios">👥 Usuarios</a>
                </li>
                <li class="nav-item"
                    sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/reportes">📊 Reportes</a>
                </li>
                <li class="nav-item"
                    sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/inventario">📋 Inventario</a>
                </li>

            </ul>

            <!-- Cerrar sesión -->
            <form th:action="@{/logout}" method="post" class="d-flex mt-2 mt-lg-0">
                <button type="submit" class="btn btn-outline-light btn-sm w-100">
                    🚪 Cerrar sesión
                </button>
            </form>
        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmB0LKZG2iHKDCu3v7oUSMrRBGE" crossorigin="anonymous"></script>
</body>
</html>
