<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Botica</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex; justify-content: center;
            align-items: center; min-height: 100vh; }
        .login-box { background: white; padding: 40px;
            border-radius: 12px; width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #2E7D32; font-size: 28px; }
        .logo p { color: #888; font-size: 14px;
            margin-top: 5px; }
        .campo { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px;
            font-weight: bold; color: #555;
            font-size: 14px; }
        input { width: 100%; padding: 12px;
            border: 1px solid #ddd; border-radius: 8px;
            font-size: 14px; transition: all 0.2s; }
        input:focus { outline: none;
            border-color: #2E7D32;
            box-shadow: 0 0 0 3px rgba(46,125,50,0.1); }
        .btn-login { width: 100%; padding: 12px;
            background: #2E7D32; color: white;
            border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold;
            cursor: pointer; transition: all 0.2s;
            margin-top: 10px; }
        .btn-login:hover { background: #1B5E20; }
        .error { background: #ffebee; color: #c62828;
            padding: 12px; border-radius: 8px;
            margin-bottom: 20px; font-size: 14px;
            text-align: center; }
        .footer { text-align: center; margin-top: 20px;
            color: #aaa; font-size: 12px; }
    </style>
</head>
<body>
<div class="login-box">

    <div class="logo">
        <h1>💊 Sistema Botica</h1>
        <p>Ingresa tus credenciales para continuar</p>
    </div>

    <!-- Mensaje de error -->
    <div class="error" th:if="${error}"
         th:text="${error}"></div>

    <form th:action="@{/login}" method="post">

        <div class="campo">
            <label>Usuario</label>
            <input type="text" name="username"
                   placeholder="Ej: admin"
                   autofocus/>
        </div>

        <div class="campo">
            <label>Contraseña</label>
            <input type="password" name="password"
                   placeholder="Tu contraseña"/>
        </div>

        <button type="submit" class="btn-login">
            Iniciar Sesión
        </button>

    </form>

    <div class="footer">
        Sistema de Gestión de Inventario y Ventas
    </div>
</div>
</body>
</html>
