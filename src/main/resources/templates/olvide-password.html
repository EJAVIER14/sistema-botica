<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - Sistema Botica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f1f8e9; min-height:100vh; display:flex; align-items:center; justify-content:center;">
<div class="card shadow" style="max-width:420px; width:100%; border-radius:16px; border:none;">
    <div class="card-body p-4">
        <h4 class="mb-3" style="color:#1B5E20; font-weight:700;">🔑 Recuperar contraseña</h4>
        <p class="text-muted small">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>

        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

        <form th:action="@{/olvide-password}" method="post">
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" name="email" class="form-control" required placeholder="tucorreo@ejemplo.com"/>
            </div>
            <button type="submit" class="btn w-100" style="background:#2E7D32; color:white;">Enviar enlace</button>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/login}" class="small text-muted">← Volver al inicio de sesión</a>
        </div>
    </div>
</div>
</body>
</html>
